function buildMonthlySeries(){const months=[];const now=new Date();for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;months.push({key,label:d.toLocaleDateString('en-IN',{month:'short'}),income:state.transactions.filter(t=>t.type==='income'&&t.date?.startsWith(key)).reduce((a,t)=>a+t.amount,0),expenses:state.transactions.filter(t=>t.type==='expense'&&t.date?.startsWith(key)).reduce((a,t)=>a+t.amount,0)})}return months}
function drawCashChart(mode='cash'){const c=$('#cashChart');if(!c)return;const ctx=c.getContext('2d'),rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=rect.width*dpr;c.height=rect.height*dpr;ctx.scale(dpr,dpr);const w=rect.width,h=rect.height,p={l:48,r:10,t:14,b:29};ctx.clearRect(0,0,w,h);const arr=buildMonthlySeries(),maxVal=Math.max(...arr.map(a=>mode==='net'?Math.abs(a.income-a.expenses):Math.max(a.income,a.expenses)),10000)*1.15;ctx.font='10px system-ui';ctx.fillStyle='#89958c';ctx.textAlign='right';ctx.strokeStyle='#edf1ed';ctx.lineWidth=1;for(let i=0;i<=4;i++){const y=p.t+(h-p.t-p.b)*i/4;ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(w-p.r,y);ctx.stroke();const val=maxVal*(4-i)/4;ctx.fillText(val>=100000?'₹'+(val/100000).toFixed(1)+'L':val>=1000?'₹'+Math.round(val/1000)+'k':'₹'+Math.round(val),p.l-8,y+3)}const chartH=h-p.t-p.b,chartW=w-p.l-p.r,step=chartW/arr.length;arr.forEach((a,i)=>{const center=p.l+step*i+step/2;if(mode==='net'){const value=a.income-a.expenses,base=p.t+chartH/2;ctx.strokeStyle='#e6ece7';ctx.beginPath();ctx.moveTo(p.l,base);ctx.lineTo(w-p.r,base);ctx.stroke();const bh=Math.abs(value)/maxVal*chartH*1.8;ctx.fillStyle=value>=0?'#477f61':'#d18a6c';ctx.beginPath();ctx.roundRect(center-step*.22,value>=0?base-bh:base,step*.44,bh,5);ctx.fill()}else{const bw=Math.min(17,step*.26),hi=a.income/maxVal*chartH,he=a.expenses/maxVal*chartH;ctx.fillStyle='#2d7155';ctx.beginPath();ctx.roundRect(center-bw-2,p.t+chartH-hi,bw,hi,4);ctx.fill();ctx.fillStyle='#d9a17c';ctx.beginPath();ctx.roundRect(center+2,p.t+chartH-he,bw,he,4);ctx.fill()}ctx.fillStyle='#7f8b82';ctx.textAlign='center';ctx.fillText(a.label,center,h-8)})}

function field(label,name,value='',type='text',opts={}){const attr=opts.attr||'';const full=opts.full?' full':'';const hint=opts.hint?`<span class="hint">${escapeHtml(opts.hint)}</span>`:'';let control='';if(type==='textarea')control=`<textarea class="input" name="${name}" rows="${opts.rows||3}" ${opts.required?'required':''} ${attr}>${escapeHtml(value)}</textarea>`;else if(type==='select'){control=`<select class="input" name="${name}" ${opts.required?'required':''} ${attr}>${(opts.options||[]).map(o=>{const val=typeof o==='string'?o:o.value,lab=typeof o==='string'?o:o.label;return `<option value="${escapeHtml(val)}" ${String(val)===String(value)?'selected':''}>${escapeHtml(lab)}</option>`}).join('')}</select>`}else if(type==='checkbox')control=`<label class="check-label"><input type="checkbox" name="${name}" ${value?'checked':''} ${attr}> ${escapeHtml(opts.checkText||label)}</label>`;else control=`<input class="input" name="${name}" type="${type}" value="${escapeHtml(value)}" ${opts.required?'required':''} ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.max!==undefined?`max="${opts.max}"`:''} ${opts.step?`step="${opts.step}"`:''} ${opts.placeholder?`placeholder="${escapeHtml(opts.placeholder)}"`:''} ${attr}>`;return `<div class="field${full}"><label>${escapeHtml(label)}${opts.required?' *':''}</label>${control}${hint}</div>`}

function eventFormMarkup(e=null,defaultDate=null,defaults={}){const obj=e||{title:defaults.title||'',type:defaults.type||'Wedding',date:defaultDate||dateOffset(7),time:'11:00',endTime:'15:00',clientId:defaults.clientId||'',venue:'',guests:defaults.guests||100,packageId:defaults.packageId||state.packages[0]?.id,rate:currentPackage(defaults.packageId||state.packages[0]?.id)?.rate||450,extras:0,staffCost:0,transport:0,rentals:0,other:0,discount:0,taxRate:state.business.taxRate,status:defaults.status||'Enquiry',paid:0,notes:defaults.notes||'',staffAssignments:[]};const packages=optionsPackages(obj.packageId);const subtotal=eventSubtotal(obj),total=eventTotal(obj);return `<input type="hidden" name="id" value="${escapeHtml(obj.id||'')}"><div class="form-grid"><div class="form-section-title">Event & customer details</div>${field('Event name','title',obj.title,'text',{required:true,full:true,placeholder:'e.g. Priya & Arjun — Wedding Reception'})}${field('Client','clientId',obj.clientId,'select',{required:true,options:optionsClients(obj.clientId)})}${field('Event type','type',obj.type,'select',{options:['Wedding','Reception','Engagement','Birthday','Housewarming','Corporate','Festival','Memorial','Other'].map(s=>({value:s,label:s}))})}${field('Event date','date',obj.date,'date',{required:true})}${field('Reporting / service start','time',obj.time,'time',{required:true})}${field('Service end','endTime',obj.endTime,'time')}${field('Expected guests','guests',obj.guests,'number',{required:true,min:1,attr:'data-event-calc'})}${field('Venue / service address','venue',obj.venue,'text',{required:true,full:true,placeholder:'Venue name, street and city'})}${field('Booking status','status',obj.status,'select',{options:['Enquiry','Quotation','Negotiation','Confirmed','Preparing','In progress','Completed','Cancelled'].map(s=>({value:s,label:s}))})}<div class="form-section-title">Menu & quotation inputs</div>${field('Catering package','packageId',obj.packageId,'select',{full:true,options:p function updateEventCalc(){const f=$('#modalForm');if(!f||!f.querySelector('[name="guests"]'))return;const n=name=>Number(f.elements[name]?.value)||0;const guests=n('guests'),addons=menuSelectionAmount({guests,menuSelections:modalMenuSelections});const subtotal=Math.max(0,guests*n('rate')+addons+n('extras')+n('staffCost')+n('transport')+n('rentals')+n('other')-n('discount')),tax=subtotal*n('taxRate')/100,total=subtotal+tax;const set=(id,v)=>{const el=$(id);if(el)el.textContent=v};set('#calcFood',money(guests*n('rate')));set('#calcMenuAddons',money(addons));set('#calcExtras',money(n('extras')+n('staffCost')+n('transport')+n('rentals')+n('other')));set('#calcDiscount','−'+money(n('discount')));set('#calcSubtotal',money(subtotal));set('#calcTax',money(tax));set('#calcTotal',money(total));const hid=$('#menuSelectionsData');if(hid)hid.value=JSON.stringify(modalMenuSelections)}

function recipeText(recipe=[]){return (recipe||[]).map(r=>`${r.item} | ${r.perGuest} | ${r.unit}`).join('\n')}function parseRecipeRows(value){return String(value||'').split(/\r?\n/).map(line=>line.split('|').map(x=>x.trim())).filter(parts=>parts[0]&&Number(parts[1])>0&&parts[2]).map(parts=>({item:parts[0],perGuest:Number(parts[1]),unit:parts[2]}))}function projectedInventoryUsage(){const usage={};const add=(menu,servings,multiplier=1)=>{(menu?.recipe||[]).forEach(r=>{const item=state.inventory.find(i=>i.name.toLowerCase()===String(r.item).toLowerCase());if(!item||String(item.unit).toLowerCase()!==String(r.unit).toLowerCase())return;usage[item.id]=(usage[item.id]||0)+(Number(r.perGuest)||0)*servings*multiplier})};upcomingEvents().forEach(ev=>{const pkg=currentPackage(ev.packageId);(pkg?.includes||[]).forEach(name=>{const menu=state.menus.find(m=>m.name===name);const perGuest=/per guest|per plate/i.test(menu?.unit||'');add(menu,perGuest?(Number(ev.guests)||0):1)});(ev.menuSelections||[]).forEach(sel=>{const menu=state.menus.find(m=>m.id===sel.menuId);const perGuest=/per guest|per plate/i.test(menu?.unit||'');add(menu,perGuest?(Number(ev.guests)||0):(Number(sel.quantity)||0),perGuest?(Number(sel.quantity)||0):1)})});return usage}

function openTransactionForm(type='expense',txnId=null,defaults={}){const t=txnId?state.transactions.find(x=>x.id===txnId):null;const isIncome=type==='income';const body=`<input type="hidden" name="id" value="${escapeHtml(t?.id||'')}"><input type="hidden" name="type" value="${isIncome?'income':'expense'}"><div class="form-grid">${field('Description','description',t?.description||defaults.description||'','text',{required:true,full:true})}${field('Category','category',t?.category||(isIncome?'Client payment':'Ingredients'),'select',{options:(isIncome?['Client payment','Additional service','Other income','Refund reversal']:['Ingredients','Staff wages','Transport','Equipment rental','Packaging','Utilities','Venue / kitchen rent','Marketing','Maintenance','Other expense']).map(x=>({value:x,label:x}))})}${field('Amount (₹)','amount',t?.amount??defaults.amount??0,'number',{required:true,min:0.01,step:'0.01'})}${field('Date','date',t?.date||dateOffset(0),'date',{required:true})}${field('Linked event','eventId',t?.eventId||defaults.eventId||'','select',{options:[{value:'',label:'No linked event'},...state.events.filter(e=>e.status!=='Cancelled').map(e=>({value:e.id,label:e.title+' · '+fmtShort(e.date)}))]})}${field('Payment method','method',t?.method||'UPI','select',{options:['UPI','Bank transfer','Cash','Card','Credit / payable','Other'].map(x=>({value:x,label:x}))})}${field('Notes / reference','notes',t?.notes||'','text',{full:true})}</div>`;modalOpen(t?'Edit transaction':isIncome?'Record income':'Record expense',t?'Update the ledger record.':'Record the movement of money with a category and date.',body,form=>{const d=Object.fromEntries(new FormData(form).entries()),old=t?Number(t.amount)||0:0;d.amount=Number(d.amount)||0;d.clientId=eventById(d.eventId)?.clientId||'';d.id=t?.id||uid('T');if(d.amount<=0){toast('Enter an amount greater than zero','error');return}if(t){if(t.type==='income'&&t.eventId){const oldEv=eventById(t.eventId);if(oldEv)oldEv.paid=Math.max(0,(Number(oldEv.paid)||0)-old)}Object.assign(t,d);if(t.type==='income'&&t.eventId){const ev=eventById(t.eventId);if(ev)ev.paid=(Number(ev.paid)||0)+d.amount}}else{state.transactions.unshift(d);if(d.type==='income'&&d.eventId){const ev=eventById(d.eventId);if(ev)ev.paid=(Number(ev.paid)||0)+d.amount}}addActivity(t?'Transaction updated':'Transaction recorded',`${isIncome?'Income':'Expense'} · ${money(d.amount)} · ${d.description}`,'wallet');persist();modalClose();renderPage();toast(t?'Transaction updated':'Transaction recorded')},{submitLabel:t?'Save transaction':isIncome?'Record income':'Record expense'})}

function openEnquiryForm(qid=null,defaults={}){const q=qid?state.enquiries.find(x=>x.id===qid):null;const body=`<input type="hidden" name="id" value="${escapeHtml(q?.id||'')}"><div class="form-grid">${field('Contact / organisation','name',q?.name||defaults.name||'','text',{required:true})}${field('Phone','phone',q?.phone||'','tel',{required:true})}${field('Email','email',q?.email||'','email')}${field('Event type','eventType',q?.eventType||defaults.type||'Wedding','select',{options:['Wedding','Reception','Engagement','Birthday','Housewarming','Corporate','Festival','Other'].map(x=>({value:x,label:x}))})}${field('Requested date','date',q?.date||defaults.date||dateOffset(14),'date',{required:true})}${field('Estimated guest count','guests',q?.guests||defaults.guests||100,'number',{required:true,min:1})}${field('Budget (₹)','budget',q?.budget||0,'number',{min:0,step:'0.01'})}${field('Enquiry source','source',q?.source||'Website','select',{options:['Website','WhatsApp','Instagram','Google Maps','Referral','Phone call','Repeat client','Other'].map(x=>({value:x,label:x}))})}${field('Lead status','status',q?.status||'New','select',{options:['New','Contacted','Quoted','Converted','Lost'].map(x=>({value:x,label:x}))})}${field('Requirements / client message','message',q?.message||'','textarea',{full:true,rows:4})}</div>`;modalOpen(q?'Edit enquiry':'Log an enquiry',q?'Update lead details and follow-up status.':'Capture a customer request before preparing a quotation.',body,form=>{const d=Object.fromEntries(new FormData(form).entries());d.guests=Number(d.guests)||0;d.budget=Number(d.budget)||0;d.id=q?.id||uid('Q');d.created=q?.created||dateOffset(0);if(q)Object.assign(q,d);else state.enquiries.unshift(d);persist();modalClose();renderPage();toast(q?'Enquiry updated':'Enquiry added');addActivity(q?'Enquiry updated':'New lead recorded',d.name+' · '+d.eventType,'message')},{submitLabel:q?'Save enquiry':'Log enquiry'})}
function openReviewForm(id=null){const r=id?state.reviews.find(x=>x.id===id):null;const body=`<input type="hidden" name="id" value="${escapeHtml(r?.id||'')}"><div class="form-grid">${field('Reviewer / customer','name',r?.name||'','text',{required:true})}${field('Event / service','event',r?.event||'Wedding catering','text',{required:true})}${field('Rating','rating',r?.rating||5,'select',{options:[5,4,3,2,1].map(n=>({value:n,label:`${n} out of 5 stars`}))})}${field('Review date','date',r?.date||dateOffset(0),'date',{required:true})}${field('Verified booking?','verified',r?!!r.verified:true,'checkbox',{checkText:'Review relates to a recorded booking',full:true})}${field('Customer feedback','text',r?.text||'','textarea',{full:true,rows:4,required:true})}${field('Owner response','reply',r?.reply||'','textarea',{full:true,rows:2})}</div>`;modalOpen(r?'Manage review':'Add guest review','Store the review and an optional owner response for storefront publication.',body,form=>{const d=Object.fromEntries(new FormData(form).entries());d.rating=Number(d.rating)||5;d.verified=form.elements.verified.checked;d.id=r?.id||uid('R');if(r)Object.assign(r,d);else state.reviews.unshift(d);persist();modalClose();renderPage();toast(r?'Review updated':'Review added')},{submitLabel:r?'Save review':'Add review'})}
function eventDetailMarkup(e){const sub=eventSubtotal(e),total=eventTotal(e),tax=total-sub,pack=currentPackage(e.packageId),client=currentClient(e.clientId);return `<div class="grid two-col" style="gap:12px;margin-bottom:17px"><div class="report-box"><label>Quotation total</label><strong>${money(total)}</strong><small>${money(e.paid)} received · ${eventCredit(e)>0?money(eventCredit(e))+' client credit':money(eventBalance(e))+' balance due'}</small></div><div class="report-box"><label>Event stage</label><div style="margin:12px 0 8px">${badge(e.status)}</div><small>${e.guests.toLocaleString('en-IN')} expected guests · ${fmtDate(e.date)}</small></div></div><div class="form-grid"><div class="form-section-title">Event & customer</div><div class="field"><label>Event</label><div style="font-size:12px;font-weight:750">${escapeHtml(e.title)}</div><span class="hint">${escapeHtml(e.type)}</span></div><div class="field"><label>Client</label><div style="font-size:12px;font-weight:750">${escapeHtml(client?.name||'—')}</div><span class="hint">${escapeHtml(client?.phone||'')} · ${escapeHtml(client?.email||'')}</span></div><div class="field"><label>Date and time</label><div style="font-size:12px;font-weight:700">${fmtDate(e.date)}</div><span class="hint">${escapeHtml(e.time)}–${escapeHtml(e.endTime||'—')}</span></div><div class="field"><label>Venue</label><div style="font-size:12px;font-weight:700">${escapeHtml(e.venue)}</div><span class="hint"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.venue)}">Open directions ↗</a></span></div><div class="field"><label>Package / menu</label><div style="font-size:12px;font-weight:700">${escapeHtml(pack?.name||'Custom catering')}</div><span class="hint">${escapeHtml(pack?.cuisine||'Mixed')} · ${money(e.rate)} per guest</span></div><div class="field"><label>Guest count</label><div style="font-size:12px;font-weight:700">${e.guests.toLocaleString('en-IN')} guests</div><span class="hint iv class="event-row"><div class="mini-avatar">${initials(emp?.name||'Staff')}</div><div class="event-main"><strong>${escapeHtml(emp?.name||'Unknown employee')} · ${escapeHtml(a.role||emp?.role||'Crew')}</strong><small>${escapeHtml(a.startTime||e.time)}–${escapeHtml(a.endTime||e.endTime)} · ${(a.tasks||[]).filter(t=>t.done).length}/${(a.tasks||[]).length} tasks complete</small></div>${badge(a.checkedIn?'Checked in':a.status||'Assigned')}</div>`}).join('')||'<p class="muted" style="font-size:11px">No staff assignments are recorded yet.</p>'}<button class="btn btn-secondary btn-sm" style="margin-top:10px" type="button" data-action="assign-event" data-id="${e.id}">${ico('users',13)} Manage staff allocation</button></div><div class="form-section-title">Client instructions</div><div class="field full"><div class="subtle-note">${escapeHtml(e.notes||'No special instructions recorded.')}</div></div></div>`}
function openEventDetail(id){const e=eventById(id);if(!e)return;modalOpen(e.title,`${e.id} · ${fmtDate(e.date)} · ${e.guests} guests`,eventDetailMarkup(e),null,{wide:true,viewOnly:true,footer:`<button type="button" class="btn btn-secondary" data-action="close-modal">Close</button><div class="right-actions"><button type="button" class="btn btn-secondary" data-action="record-payment" data-id="${e.id}">${ico('wallet',14)} Record payment</button><button type="button" class="btn btn-secondary" data-action="open-quote" data-id="${e.id}">${ico('receipt',14)} View quote</button><button type="button" class="btn btn-primary" data-action="edit-event" data-id="${e.id}">${ico('edit',14)} Edit event</button></div>`})}
function quoteHtml(e){const b=state.business,c=currentClient(e.clientId),pack=currentPackage(e.packageId),sub=eventSubtotal(e),total=eventTotal(e),tax=total-sub;return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quotation QT-${e.id.replace('EV','')} · ${escapeHtml(b.name)}</title><style>body{font-family:Arial,sans-serif;color:#26382d;margin:0;background:#f3f6f3;font-size:13px}.sheet{max-width:850px;margin:30px auto;background:white;padding:42px 48px;box-shadow:0 10px 50px #0001}.top{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #214938;padding-bottom:24px}.logo{font-family:Georgia,serif;font-size:25px;color:#214938;font-weight:bold}.muted{color:#79877e;font-size:11px;line-height:1.7}.right{text-align:right}.title{margin:28px 0 20px;display:flex;justify-content:space-between;align-items:end}.title h1{margin:0;font-size:28px}.badge{display:inline-block;background:#e8f3ea;color:#2c6b44;padding:5px 9px;border-radius:6px;font-size:10px;font-weight:bold}.details{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:26px}.details h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#829087;margin:0 0 9px}.details strong{display:block;margin:5px 0}.details p{margin:4px 0;color:#657268}.rows{width:100%;border-collapse:collapse}.rows th{text-align:left;color:#829087;font-size:10px;text-transform:uppercase;border-bottom:1px solid #e2eae3;padding:11px 8px}.rows td{padding:12px 8px;border-bottom:1px solid #edf1ed}.rows th:last-child,.rows td:last-child{text-align:right}.totals{width:310px;margin:17px 0 0 auto}.line{display:flex;justify-content:space-between;padding:7px 0;color:#67776b}.line.total{border-top:2px solid #214938;font-weight:bold;font-size:17px;color:#214938;margin-top:5px;padding-top:12px}.terms{background:#f5f8f5;border-radius:9px;padding:15px;margin-top:25px;color:#69796e;font-size:11px;line-height:1.8}.footer{margin-top:28px;border-top:1px solid #e4ebe5;padding-top:16px;display:flex;justify-content:space-between;gap:15px;color:#859188;font-size:10px}@media(max-width:600px){.sheet{padding:20px;margin:0}.top,.details,.title{flex-direction:column}.right{text-align:left}.totals{width:100%}}@media print{body{background:white}.sheet{margin:0;box-shadow:none;max-width:none;padding:20px 25px}}</style></head><body><main class="sheet"><header class="top"><div><div class="logo">${escapeHtml(b.name)}</div><div class="muted">${escapeHtml(b.tagline||'Catering with care')}<br>${escapeHtml(b.address)}, ${escapeHtml(b.city)}, ${escapeHtml(b.state)} ${escapeHtml(b.pincode)}<br>${escapeHtml(b.phone)} · ${escapeHtml(b.email)}</div></div><div class="right"><div style="font-weight:bold">QUOTATION</div><div class="muted">QT-${e.id.replace('EV','')}<br>Issued: ${fmtDate(dateOffset(0))}<br>Valid for ${Number(b.quoteValidity)||7} days</div></div></header><div class="title"><div><div class="muted">Prepared for</div><h1>${escapeHtml(c?.name||'Valued client')}</h1></div><span class="badge">${escapeHtml(e.status)}</span></div><section class="details"><div><h3>Event details</h3><strong>${escapeHtml(e.title)}</strong><p>${escapeHtml(e.type)} · ${fmtDate(e.date)}</p><p>${escapeHtml(e.time)}${e.endTime?' – '+escapeHtml(e.endTime):''} · ${e.guests} guests</p><p>${escapeHtml(e.venue)}</p></div><div><h3>Package & service</h3><strong>${escapeHtml(pack?.name||'Custom catering service')}</strong><p>${escapeHtml(pack?.description||'Custom menu and service selection')}</p><p>${escapeHtml(pack?.cuisine||'Mixed')} · ${money(e.rate)} per guest</p><p>${escapeHtml((pack?.includes||[]).join(', '))}</p></div></section><table class="rows"><thead><tr><th>Service description</th><th>Calculation</th><th>Amount</th></tr></thead><tbody><tr><td><strong>Food package</strong><div class="muted">${escapeHtml(pack?.name||'Catering menu')}</div></td><td>${e.guests} × ${money(e.rate)}</td><td>${money(e.guests*e.rate)}</td></tr>${menuSelectionQuoteRows(e)}<tr><td>Additional menu / service items</td><td>Flat / manual services</td><td>${money(e.extras)}</td></tr><tr><td>Staffing and labour</td><td>Event shift plan</td><td>${money(e.staffCost)}</td></tr><tr><td>Transport and delivery</td><td>Event location</td><td>${money(e.transport)}</td></tr><tr><td>Equipment and rentals</td><td>Selected equipment</td><td>${money(e.rentals)}</td></tr><tr><td>Other charges</td><td>As agreed</td><td>${money(e.other)}</td></tr><tr><td>Discount</td><td>Applied to this quote</td><td>−${money(e.discount)}</td></tr></tbody></table><div class="totals"><div class="line"><span>Subtotal</span><strong>${money(sub)}</strong></div><div class="line"><span>Tax (${Number(e.taxRate)||0}%)</span><strong>${money(tax)}</strong></div><div class="line total"><span>Total</span><strong>${money(total)}</strong></div><div class="line"><span>Advance / received</span><strong>${money(e.paid)}</strong></div><div class="line"><span>${eventCredit(e)>0?'Client credit':'Balance remaining'}</span><strong>${money(eventCredit(e)>0?eventCredit(e):eventBalance(e))}</strong></div></div><div class="terms"><strong>Booking and service notes</strong><br>${escapeHtml(e.notes||'Menu quantities and service details will be reconfirmed before event day.')}<br><br><strong>Payment terms</strong><br>Requested advance: ${Number(b.advancePercent)||30}% of the confirmed booking value, unless otherwise agreed. ${escapeHtml(b.bankNote||'Payment details will be shared on confirmation.')}<br><br>This quotation is based on the guest count and services shown above. Changes to guest count, menu or venue timing may affect the final amount. Applicable tax treatment should be confirmed before issuing a final tax invoice.</div><footer class="footer"><span>Thank you for considering ${escapeHtml(b.name)}.</span><span>${escapeHtml(b.website||'')} · ${escapeHtml(b.email)}</span></footer></main><script>window.addEventListener('load',()=>{setTimeout(()=>window.print(),350)})<\/script></body></html>`}
function openQuote(id){const e=eventById(id);if(!e)return;const sub=eventSubtotal(e),total=eventTotal(e),tax=total-sub;modalOpen(`Quotation QT-${e.id.replace('EV','')}`,`${clientName(e.clientId)} · ${escapeHtml(e.title)}`,`<div class="flex justify-between align-center" style="gap:10px;margin-bottom:17px"><div><div class="eyebrow">Quotation summary</div><div style="font-size:12px;color:#69776d">${fmtDate(e.date)} · ${e.guests} guests · ${escapeHtml(e.venue)}</div></div>${badge(e.status)}</div><div class="grid two-col" style="gap:10px;margin-bottom:17px"><div class="report-box"><label>Quotation total</label><strong>${money(total)}</strong><small>${money(e.paid)} recorded as received</small></div><div class="report-box"><label>${eventCredit(e)>0?'Client credit':'Balance remaining'}</label><strong>${money(eventCredit(e)>0?eventCredit(e):eventBalance(e))}</strong><small>${eventCredit(e)>0?'Payments exceed the revised quotation':'Due before / after event as per terms'}</small></div></div><div class="table-wrap"><table><thead><tr><th>Line item</th><th>Basis</th><th>Amount</th></tr></thead><tbody><tr><td><strong>Food package</strong></td><td>${e.guests} × ${money(e.rate)}</td><td>${money(e.guests*e.rate)}</td></tr>${menuSelectionQuoteRows(e)}<tr><td>Additional services / manual extras</td><td>Flat</td><td>${money(e.extras)}</td></tr><tr><td>Staffing</td><td>Flat</td><td>${money(e.staffCost)}</td></tr><tr><td>Transport</td><td>Flat</td><td>${money(e.transport)}</td></tr><tr><td>Equipment rentals</td><td>Flat</td><td>${money(e.rentals)}</td></tr><tr><td>Other charges</td><td>Flat</td><td>${money(e.other)}</td></tr><tr><td>Discount</td><td>Flat</td><td>−${money(e.discount)}</td></tr><tr><td>Subtotal</td><td>Before tax</td><td>${money(sub)}</td></tr><tr><td>Tax</td><td>${Number(e.taxRate)||0}% configured</td><td>${money(tax)}</td></tr><tr><td><strong>Total</strong></td><td></td><td><strong>${money(total)}</strong></td></tr></tbody></table></div><div class="subtle-note" style="margin-top:15px">${escapeHtml(e.notes||'No additional event notes.')}<br>Quote validity: ${Number(state.business.quoteValidity)||7} days from issue date. Payment terms: ${Number(state.business.advancePercent)||30}% requested advance unless agreed otherwise.</div>`,null,{wide:true,viewOnly:true,footer:`<button type="button" class="btn btn-secondary" data-action="close-modal">Close</button><div class="right-actions"><button type="button" class="btn btn-secondary" data-action="record-payment" data-id="${e.id}">${ico('wallet',14)} Record payment</button><button type="button" class="btn btn-secondary" data-action="edit-event" data-id="${e.id}">${ico('edit',14)} Edit quote</button><button type="button" class="btn btn-primary" data-action="print-quote" data-id="${e.id}">${ico('download',14)} Print / Save PDF</button></div>`})}
function assignmentFormMarkup(defaults={}){const e=eventById(defaults.eventId)||state.events.find(x=>x.status!=='Cancelled'&&x.date>=dateOffset(0))||state.events[0];const emp=state.employees.find(x=>x.id===defaults.employeeId)||state.employees.find(x=>x.status==='Active');const existing=e?.staffAssignments?.find(a=>a.employeeId===(defaults.employeeId||''));return `<div class="form-grid">${field('Event','eventId',e?.id||'','select',{required:true,options:state.events.filter(x=>x.status!=='Cancelled').sort((a,b)=>a.date.localeCompare(b.date)).map(x=>({value:x.id,label:`${x.title} · ${fmtShort(x.date)} · ${x.guests} guests`}))})}${field('Employee','employeeId',emp?.id||'','select',{required:true,options:state.employees.filter(x=>x.status==='Active').map(x=>({value:x.id,label:x.name+' · '+x.role}))})}${field('Assigned duty','role',existing?.role||emp?.role||'Service crew','text',{required:true})}${field('Assignment status','status',existing?.status||'Assigned','select',{options:['Assigned','Awaiting acceptance','Confirmed','Declined','Completed'].map(x=>({value:x,label:x}))})}${field('Reporting time','startTime',existing?.startTime||e?.time||'08:00','time',{required:true})}${field('Shift end','endTime',existing?.endTime||e?.endTime||'16:00','time',{required:true})}${field('Task checklist (one task per line)','tasks',(existing?.tasks||[{name:'Review event brief',done:false},{name:'Complete assigned service setup',done:false}]).map(t=>t.name).join('\n'),'textarea',{full:true,rows:4,hint:'Existing completed tasks are retained when the same employee is reassigned.'})}</div>`}
function openAssignmentForm(defaults={}){modalOpen('Allocate employee to an event','Assign a role and shift, and give staff a clear checklist for the service.',assignmentFormMarkup(defaults),form=>{const d=Object.fromEntries(new FormData(form).entries()),ev=eventById(d.eventId),emp=state.employees.find(x=>x.id===d.employeeId);if(!ev||!emp){toast('Choose an event and employee','error');return}ev.staffAssignments ||= [];const existing=ev.staffAssignments.find(a=>a.employeeId===emp.id);const tasks=String(d.tasks||'').split('\n').map(s=>s.trim()).filter(Boolean).map((name,i)=>({name,done:existing?.tasks?.find(t=>t.name===name)?.done||false}));const clash=state.events.some(other=>other.id!==ev.id&&other.status!=='Cancelled'&&other.date===ev.date&&(other.staffAssignments||[]).some(a=>a.employeeId===emp.id&&a.status!=='Declined'&&overlaps(d.startTime,d.endTime,a.startTime,a.endTime)));if(clash&&!confirm(`${emp.name} is already assigned to another event on ${fmtDate(ev.date)} with an overlapping shift. Save this allocation anyway?`))return;const assignment={employeeId:emp.id,role:d.role,startTime:d.startTime,endTime:d.endTime,status:d.status,checkedIn:existing?.checkedIn||false,tasks};if(existing)Object.assign(existing,assignment);else ev.staffAssignments.push(assignment);persist();modalClose();renderPage();toast(existing?'Staff assignment updated':'Staff allocated to event');addActivity('Staff allocation saved',`${emp.name} · ${ev.title}`,'users')},{submitLabel:'Save allocation',onOpen:()=>{const form=$('#modalForm');form.elements.eventId.addEventListener('change',()=>{const ev=eventById(form.elements.eventId.value);if(ev){if(form.elements.startTime&&!form.elements.startTime.value)form.elements.startTime.value=ev.time;if(form.elements.endTime&&!form.elements.endTime.value)form.elements.endTime.value=ev.endTime}});form.elements.employeeId.addEventListener('change',()=>{const emp=state.employees.find(x=>x.id===form.elements.employeeId.value);if(emp&&!form.elements.role.value)form.elements.role.value=emp.role})}})}
function overlaps(s1,e1,s2,e2){const m=s=>{const [h,mn]=String(s||'00:00').split(':').map(Number);return h*60+mn};return m(s1)<m(e2)&&m(s2)<m(e1)}
function openEnquiryDetail(id){const q=state.enquiries.find(x=>x.id===id);if(!q)return;const connected=state.clients.find(c=>c.phone.replace(/\D/g,'')===q.phone.replace(/\D/g,''));modalOpen(q.name,`${q.eventType} enquiry · ${fmtDate(q.date)} · ${q.guests} guests`,`<div class="grid two-col" style="gap:11px;margin-bottom:16px"><div class="report-box"><label>Target budget</label><strong>${money(q.budget)}</strong><small>Client-provided estimate</small></div><div class="report-box"><label>Lead status</label><div style="margin:11px 0">${badge(q.status)}</div><small>Source: ${escapeHtml(q.source)}</small></div></div><div class="form-grid"><div class="field"><label>Phone</label><strong>${escapeHtml(q.phone)}</strong></div><div class="field"><label>Email</label><strong>${escapeHtml(q.email||'—')}</strong></div><div class="field"><label>Event date</label><strong>${fmtDate(q.date)}</strong></div><div class="field"><label>Event type / guest count</label><strong>${escapeHtml(q.eventType)} · ${q.guests} guests</strong></div><div class="field full"><label>Requirements</label><div class="subtle-note">${escapeHtml(q.message||'No message recorded.')}</div></div><div class="field full"><label>Next step</label><div class="subtle-note">Convert this lead to an event record when ready to prepare a quote. Doing so links the prospective client, guest count, date and event type.</div></div></div>`,null,{viewOnly:true,footer:`<button type="button" class="btn btn-secondary" data-action="close-modal">Close</button><div class="right-actions"><button type="button" class="btn btn-secondary" data-action="mark-contacted" data-id="${q.id}">${ico('phone',14)} Mark contacted</button><button type="button" class="btn btn-primary" data-action="convert-enquiry" data-id="${q.id}">${ico('receipt',14)} Create event & quote</button></div>`})}

function calendarMarkup(){const first=new Date(selectedYear,selectedMonth,1),last=new Date(selectedYear,selectedMonth+1,0),start=(first.getDay()+6)%7,total=Math.ceil((start+last.getDate())/7)*7;let html=`<div class="flex justify-between align-center" style="margin-bottom:14px"><button type="button" class="btn btn-secondary btn-sm" data-action="calendar-prev">← Previous</button><strong>${first.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</strong><button type="button" class="btn btn-secondary btn-sm" data-action="calendar-next">Next →</button></div><div class="calendar-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="calendar-cell head">${x}</div>`).join('')}`;for(let i=0;i<total;i++){const day=i-start+1,inMonth=day>=1&&day<=last.getDate(),date=`${selectedYear}-${String(selectedMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const evs=inMonth?state.events.filter(e=>e.date===date&&e.status!=='Cancelled'):[];html+=`<div class="calendar-cell" style="${!inMonth?'background:#fafbfa;opacity:.4':''}"><div class="flex justify-between align-center"><span class="day-num">${inMonth?day:''}</span>${inMonth?`<button type="button" style="border:0;background:none;color:#829087;padding:0;font-size:14px" data-action="calendar-add" data-date="${date}" title="Add event">+</button>`:''}</div>${evs.map(e=>`<button type="button" class="calendar-event ${['Enquiry','Quotation','Negotiation'].includes(e.status)?'pending':e.type==='Corporate'?'other':''}" title="${escapeHtml(e.title)}" data-action="view-event" data-id="${e.id}">${escapeHtml(e.title)}</button>`).join('')}</div>`}html+='</div><div class="flex gap-8" style="margin-top:13px;flex-wrap:wrap;font-size:10px;color:#7e8a82"><span><i class="legend-dot" style="background:#76a88a"></i>Confirmed / completed</span><span><i class="legend-dot" style="background:#e1b96c"></i>Enquiry / quotation</span><span><i class="legend-dot" style="background:#d99c7b"></i>Corporate / other events</span></div>';return html}
function openCalendar(){modalOpen('Event calendar','Review event dates, navigate between months and create a record from a specific day.',calendarMarkup(),null,{wide:true,viewOnly:true,footer:`<button type="button" class="btn btn-secondary" data-action="close-modal">Close calendar</button><div class="right-actions"><button type="button" class="btn btn-primary" data-action="new-event">${ico('plus',14)} Create event</button></div>`})}

function bindFileUpload(fileId,hiddenId){const input=$('#'+fileId),hidden=$('#'+hiddenId);if(!input||!hidden)return;input.addEventListener('change',async()=>{const file=input.files?.[0];if(!file)return;try{const url=await compressImage(file,1200,850,.76);hidden.value=url;toast('Photo ready to save')}catch(e){toast('Could not read that image. Try another file.','error')}})}
function bindMultiFileUpload(fileId,hiddenId){const input=$('#'+fileId),hidden=$('#'+hiddenId);if(!input||!hidden)return;input.addEventListener('change',async()=>{const files=Array.from(input.files||[]);if(!files.length)return;try{const urls=[];for(const file of files.slice(0,8))urls.push(await compressImage(file,1200,850,.74));let old=[];try{old=JSON.parse(hidden.value||'[]')}catch(e){}hidden.value=JSON.stringify([...old,...urls]);toast(`${urls.length} photo${urls.length===1?'':'s'} ready to save`)}catch(e){toast('Could not load one of these images. Try another file.','error')}})}
function compressImage(file,maxW=1200,maxH=850,quality=.75){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const scale=Math.min(1,maxW/img.width,maxH/img.height),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',quality))};img.src=reader.result};reader.readAsDataURL(file)})}
function exportFile(name,content,mime='text/plain;charset=utf-8'){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function downloadJson(){exportFile(`feastflow-backup-${dateOffset(0)}.json`,JSON.stringify({app:'FeastFlow',version:1,exportedAt:new Date().toISOString(),data:state},null,2),'application/json;charset=utf-8');toast('Full data backup downloaded')}
function csvCell(v){let s=String(v??'');if(typeof v==='string'&&/^[\s]*[=+\-@]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}function exportCsv(filename,rows){const text=rows.map(r=>r.map(csvCell).join(',')).join('\r\n');exportFile(filename,'\ufeff'+text,'text/csv;charset=utf-8');toast('CSV export downloaded')}

function openShareOptions(){const b=state.business;const body=`<div class="share-option-grid"><button type="button" class="share-option" data-action="share-store-full"><span class="share-option-icon">${ico('utensils',20)}</span><strong>Portfolio + menus</strong><small>Show services, event galleries, reviews, dishes, package prices and contact details.</small><span class="share-option-link">Copy storefront link ${ico('arrow-up-right',13)}</span></button><button type="button" class="share-option" data-action="share-store-portfolio"><span class="share-option-icon">${ico('images',20)}</span><strong>Portfolio without menus</strong><small>Show the business story, services, event galleries, reviews and contact details.</small><span class="share-option-link">Copy portfolio link ${ico('arrow-up-right',13)}</span></button></div><div class="subtle-note mt-16">This file creates a local preview address. To let clients open the link on their own devices, publish the page to a web host and connect shared storage for enquiries and edits.</div>`;modalOpen('Share your storefront',`Choose what ${escapeHtml(b.name)} would like to share.`,body,null,{viewOnly:true,wide:true,footer:`<button type="button" class="btn btn-secondary" data-action="close-modal">Close</button>`})}function copyStoreAddress(portfolioOnly=false){modalClose();const url=location.href.split('#')[0]+(portfolioOnly?'#storefront-no-menu':'#storefront');try{if(navigator.clipboard?.writeText){navigator.clipboard.writeText(url).then(()=>toast('Link copied. Public access requires hosting this page.')).catch(()=>fallbackCopy(url))}else fallbackCopy(url)}catch(e){fallbackCopy(url)}}function openPublicReview(){const options=[{value:'',label:'Select the service you attended'},...state.events.filter(e=>e.status==='Completed').map(e=>({value:e.title,label:`${e.title} · ${e.type}`})),{value:'General experience',label:'General experience'}];const body=`<div class="form-grid">${field('Your name','name','','text',{required:true})}${fi function shareStore(){const url=location.href.split('#')[0]+'#storefront';try{navigator.clipboard.writeText(url).then(()=>toast('Storefront address copied. Hosting is needed for a public cross-device link.')).catch(()=>fallbackCopy(url))}catch(e){fallbackCopy(url)}}function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Storefront address copied. Hosting is needed for a public cross-device link.')}catch(e){modalOpen('Storefront address','Copy this address into your message.',`<textarea class="input" rows="3" readonly>${escapeHtml(text)}</textarea>`,null,{viewOnly:true,footer:`<button type="button" class="btn btn-primary" data-action="close-modal">Done</button>`})}ta.remove()}

function quickCreate(){modalOpen('What would you like to create?','Choose a record type to open the relevant workflow.',`<div class="grid two-col" style="gap:10px"><button type="button" class="btn btn-secondary" style="justify-content:flex-start;white-space:normal;padding:16px" data-action="new-event">${ico('calendar',19)}<span style="text-align:left"><strong style="display:block">Event / booking</strong><small style="font-weight:500;color:#7a867e">Dates, guest count, quote and staff</small></span></button><button type="button" class="btn btn-secondary" style="justify-content:flex-start;white-space:normal;padding:16px" data-action="new-quote">${ico('receipt',19)}<span style="text-align:left"><strong style="display:block">Quotation</strong><small style="font-weight:500;color:#7a867e">Build itemised event pricing</small></span></button><button type="button" class="btn btn-secondary" style="justify-content:flex-start;white-space:normal;padding:16px" data-action="new-client">${ico('users',19)}<span style="text-align:left"><strong style="display:block">Client</strong><small style="font-weight:500;color:#7a867e">Contact and preferences</small></span></button><button type="button" class="btn btn-secondary" style="justify-content:flex-start;white-space:normal;padding:16px" data-action="new-menu">${ico('utensils',19)}<span style="text-align:left"><strong style="display:block">Menu item</strong><small style="font-weight:500;color:#7a867e">Dish, price and ingredients</small></span></button><button type="button" class="btn btn-secondary" style="justify-content:flex-start;white-space:normal;padding:16px" data-action="new-employee">${ico('users',19)}<span style="text-align:left"><strong style="display:block">Employee</strong><small style="font-weight:500;color:#7a867e">Register a team member</small></span></button><button type="button" class="btn btn-secondary" style="justify-content:flex-start;white-space:normal;padding:16px" data-action="new-expense">${ico('wallet',19)}<span style="text-align:left"><strong style="display:block">Expense</strong><small style="font-weight:500;color:#7a867e">Record a business cost</small></span></button></div>`,null,{viewOnly:true,footer:`<button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>`})}
let menuCuisineFilter='all',menuCategoryFilter='all',clientSourceFilter='all',enquiryStatusFilter='all',eventDateFilter='all',quoteStatusFilter='all',portfolioTypeFilter='all',teamRoleFilter='all',teamStatusFilter='all',chartMode='cash';
function bindPage(){if(currentPage==='dashboard')drawCashChart(chartMode);if(currentPage==='finance'){drawCanvasChart('financeChart');drawDonut()}if(currentPage==='reports')drawCanvasChart('reportChart');updatePersistentChrome()}
function drawCanvasChart(id){const c=$('#'+id);if(!c)return;const ctx=c.getContext('2d'),rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(1,rect.width*dpr);c.height=Math.max(1,rect.height*dpr);ctx.scale(dpr,dpr);const w=rect.width,h=rect.height,p={l:48,r:8,t:15,b:27};ctx.clearRect(0,0,w,h);const arr=buildMonthlySeries(),max=Math.max(...arr.map(a=>Math.max(a.income,a.expenses)),10000)*1.15,hh=h-p.t-p.b,ww=w-p.l-p.r;ctx.font='10px system-ui';ctx.textAlign='right';ctx.fillStyle='#89958c';for(let i=0;i<=4;i++){const y=p.t+hh*i/4;ctx.strokeStyle='#edf1ed';ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(w-p.r,y);ctx.stroke();const v=max*(4-i)/4;ctx.fillText(v>=100000?'₹'+(v/100000).toFixed(1)+'L':v>=1000?'₹'+Math.round(v/1000)+'k':'₹'+Math.round(v),p.l-7,y+3)}const step=ww/arr.length;arr.forEach((a,i)=>{const x=p.l+step*i+step/2,bw=Math.min(17,step*.25),hi=a.income/max*hh,he=a.expenses/max*hh;ctx.fillStyle='#2d7155';ctx.beginPath();ctx.roundRect(x-bw-2,p.t+hh-hi,bw,hi,4);ctx.fill();ctx.fillStyle='#d9a17c';ctx.beginPath();ctx.roundRect(x+2,p.t+hh-he,bw,he,4);ctx.fill();ctx.textAlign='center';ctx.fillStyle='#7f8b82';ctx.fillText(a.label,x,h-8)})}
function drawDonut(){const c=$('#donutChart');if(!c)return;const ctx=c.getContext('2d'),data=expenseBreakdown(),sum=data.reduce((a,x)=>a+x.amount,0),colors=['#2d7155','#c56e4e','#d5ad63','#7b9fbd','#7d8f83','#b7a3cb','#d7b1a0'];ctx.clearRect(0,0,c.width,c.height);let start=-Math.PI/2;data.forEach((x,i)=>{const ang=sum?x.amount/sum*Math.PI*2:0;ctx.beginPath();ctx.arc(75,75,58,start,start+ang);ctx.strokeStyle=colors[i%colors.length];ctx.lineWidth=18;ctx.stroke();start+=ang});ctx.fillStyle='#253b2e';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(money(sum).replace('₹','₹'),75,69);ctx.font='9px system-ui';ctx.fillStyle='#859087';ctx.fillText('EXPENSES',75,86)}
function preserveSearch(id,value){globalQuery=value;const scroll=window.scrollY;renderPage();const el=$('#'+id);if(el){el.focus();try{el.setSelectionRange(value.length,value.length)}catch(e){}}window.scrollTo(0,scroll)}

rm(id);break;case'purchase-supplier':modalClose();openPurchaseForm(null,el.dataset.supplier||'');break;case'new-supplier':modalClose();supplierForm();break;case'new-expense':modalClose();openTransactionForm('expense');break;case'new-income':modalClose();openTransactionForm('income');break;case'edit-transaction':{const t=state.transactions.find(x=>x.id===id);modalClose();if(t)openTransactionForm(t.type,id);break}case'new-enquiry':modalClose();openEnquiryForm();break;case'view-enquiry':modalClose();openEnquiryDetail(id);break;case'mark-contacted':{const q=state.enquiries.find(x=>x.id===id);if(q){q.status='Contacted';persist();modalClose();renderPage();toast('Lead marked as contacted')}break}case'convert-enquiry':{const q=state.enquiries.find(x=>x.id===id);if(!q)break;const existing=state.clients.find(c=>c.phone.replace(/\D/g,'')===q.phone.replace(/\D/g,''));const client=existing||{id:uid('C'),name:q.name,phone:q.phone,email:q.email||'',source:q.source,events:0,notes:q.message||''};if(!existing)state.clients.unshift(client);q.clientId=client.id;persist();modalClose();openEventForm(null,{title:`${q.name} — ${q.eventType}`,type:q.eventType,date:q.date,guests:q.guests,clientId:client.id,status:'Quotation',notes:q.message||'',enquiryId:q.id});break}case'new-event-for-client':{const c=currentClient(id);modalClose();openEventForm(null,{clientId:id,title:c?`${c.name} — Catering event`:'',date:dateOffset(7)});break}case'new-review':modalClose();openReviewForm();break;case'edit-review':modalClose();openReviewForm(id);break;case'open-calendar':openCalendar();break;case'calendar-prev':selectedMonth--;if(selectedMonth<0){selectedMonth=11;selectedYear--}$('#modalBody').innerHTML=calendarMarkup();break;case'calendar-next':selectedMonth++;if(selectedMonth>11){selectedMonth=0;selectedYear++}$('#modalBody').innerHTML=calendarMarkup();break;case'calendar-add':modalClose();openEventForm(null,{date:el.dataset.date});break;case'open-assignments':modalClose();openAssignmentForm();break;case'assign-event':modalClose();openAssignmentForm({eventId:id});break;case'assign-employee':modalClose();openAssignmentForm({employeeId:id});break;case'toggle-checkin':{const ev=eventById(el.dataset.event),a=ev?.staffAssignments?.find(x=>x.employeeId===el.dataset.employee);if(a){a.checkedIn=!a.checkedIn;persist();renderPage();toast(a.checkedIn?'Shift check-in recorded':'Shift check-in undone')}break}case'open-storefront':setPage('storefront');break;case'back-workspace':setPage('dashboard');break;case'share-store':openShareOptions();break;case'share-store-full':copyStoreAddress(false);break;case'share-store-portfolio':copyStoreAddress(true);break;case'new-public-review':openPublicReview();break;case'enquire-dish':{const m=state.menus.find(x=>x.id===id);customerEnquiry('',m?{message:`Interested in ${m.name}. `}:{});break}case'view-public-event':modalClose();openPublicEventDetail(id);break;case'add-menu-line':modalMenuSelections.push({menuId:state.menus.find(m=>m.available)?.id||state.menus[0]?.id,quantity:1});updateMenuAddonRows();break;case'remove-menu-line':modalMenuSelections.splice(Number(el.dataset.index),1);updateMenuAddonRows();break;case'customer-enquiry':customerEnquiry();break;case'enquire-package':customerEnquiry(id);break;case'view-all-portfolio':setPage('portfolio');break;case'portfolio-visibility':settingsTab='store';setPage('settings');break;case'toggle-setting':{const key=el.dataset.key;if(['published','showPrices','showMenu','showPortfolio','showReviews','showServices','showLocation'].includes(key)){state.business[key]=!state.business[key];persist();renderPage();toast('Storefront setting updated')}break}case'settings-tab':settingsTab=el.dataset.tab;renderPage();break;case'menus-tab':menusTab=el.dataset.tab;renderPage();break;case'clients-tab':clientsTab=el.dataset.tab;renderPage();break;case'chart-mode':chartMode=el.dataset.mode;$$('[data-action="chart-mode"]').forEach(b=>b.classList.toggle('active',b.dataset.mode===chartMode));drawCashChart(chartMode);break;case'show-alerts':showAlerts();break;case'export-backup':downloadJson();break;case'export-events':exportEvents();break;case'export-clients':exportClients();break;case'export-inventory':exportInventory();break;case'export-finance':exportFinance();break;case'export-csv-all':exportAllCsv();break;case'export-report':exportCsv(`feastflow-summary-${dateOffset(0)}.csv`,[['Metric','Value'],['Events',state.events.length],['Clients',state.clients.length],['Team members',state.employees.length],['Quoted value',state.events.filter(e=>e.status!=='Cancelled').reduce((a,e)=>a+eventTotal(e),0)],['Recorded income',state.transactions.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0)],['Recorded expenses',state.transactions.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0)],['Unpaid balances',state.events.reduce((a,e)=>a+(e.status==='Cancelled'?0:eventBalance(e)),0)],['Low-stock items',state.inventory.filter(i=>i.stock<=i.threshold).length]]);break;case'print-report':window.print();break;case'save-settings':$('#businessSettingsForm')?.requestSubmit();break;case'save-pricing':$('#pricingSettingsForm')?.requestSubmit();break;case'reset-data':if(confirm('Replace all current local records with the original workspace data? Download a backup first if needed.')){state=structuredClone(seed);state.suppliers=defaultSuppliers();state.menus.forEach(m=>{if(!Array.isArray(m.recipe))m.recipe=defaultRecipeByName(m.name)});persist();selectedEmployee=state.employees[0]?.id||'';globalQuery='';modalClose();renderPage();toast('Workspace records reset')}break;}

function saveBusinessForm(form){const d=Object.fromEntries(new FormData(form).entries());['experience','minGuests','maxGuests'].forEach(k=>d[k]=Number(d[k])||0);state.business={...state.business,...d,cover:d.coverData||d.cover||state.business.cover};delete state.business.coverData;delete state.business.coverFile;persist();renderPage();toast('Business profile saved');addActivity('Business profile updated','Business details and public contact info changed','settings')}

function importBackup(file){const reader=new FileReader();reader.onload=()=>{try{const p=JSON.parse(reader.result),data=p.data||p;if(!data.business||!Array.isArray(data.events)||!Array.isArray(data.clients)||!Array.isArray(data.menus))throw new Error('Unsupported backup');if(!confirm('Restore this backup? It will replace the records currently stored in this browser.'))return;state=data;state.suppliers||=defaultSuppliers();state.menus.forEach(m=>{if(!Array.isArray(m.recipe))m.recipe=defaultRecipeByName(m.name)});persist();selectedEmployee=state.employees?.[0]?.id||'';globalQuery='';modalClose();setPage('dashboard');toast('Backup restored successfully')}catch(e){toast('That file is not a valid FeastFlow backup.','error')}};reader.readAsText(file)}
