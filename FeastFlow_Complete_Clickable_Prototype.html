function renderPage(){const p=$('#pageContent');if(currentPage!=='storefront')p.className='page-content';else p.className='page-content';const routes={dashboard:renderDashboard,storefront:renderStorefront,menus:renderMenus,portfolio:renderPortfolio,clients:renderClients,events:renderEvents,quotations:renderQuotations,team:renderTeam,inventory:renderInventory,finance:renderFinance,reports:renderReports,employee:renderEmployee,settings:renderSettings,prototype:renderPrototypeCoverage};p.innerHTML=(routes[currentPage]||renderDashboard)();bindPage();updatePersistentChrome()}
function updatePersistentChrome(){$('#sideBusinessName').textContent=state.business.name;$('#sideOwner').textContent=state.business.owner;$('#enquiryCount').textContent=state.enquiries.filter(q=>['New','Contacted'].includes(q.status)).length;$('#globalSearch').value=globalQuery}
function pageHead(kicker,title,desc,actions=''){return `<div class="page-heading"><div><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${desc}</p></div><div class="heading-actions">${actions}</div></div>`}function panelHead(title,desc='',action=''){return `<div class="panel-head"><div><h3>${title}</h3>${desc?`<p>${desc}</p>`:''}</div>${action}</div>`}function statCard(label,value,foot,icon,progress=65){return `<div class="stat-card"><div class="stat-top"><span class="stat-label">${label}</span><span class="stat-icon">${ico(icon,18)}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div><div class="stat-line"><span style="width:${progress}%"></span></div></div>`}
function filtered(arr,selector){if(!globalQuery.trim())return arr;const q=globalQuery.toLowerCase();return arr.filter(x=>selector(x).toLowerCase().includes(q))}
function renderDashboard(){const ev=state.events.filter(e=>e.status!=='Cancelled');const confirmed=ev.filter(e=>['Confirmed','Preparing','In progress'].includes(e.status));const monthKey=`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;const monthIncome=state.transactions.filter(t=>t.type==='income'&&t.date.startsWith(monthKey)).reduce((a,t)=>a+t.amount,0);const out=ev.reduce((a,e)=>a+eventBalance(e),0);const low=state.inventory.filter(i=>i.stock<=i.threshold);const qPending=state.events.filter(e=>['Enquiry','Quotation','Negotiation'].includes(e.status)).length;const monthly=buildMonthlySeries();const max=Math.max(1,...monthly.map(m=>m.income),...monthly.map(m=>m.expenses));return `${pageHead('Monday, '+new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long'}),'A thoughtful day starts with a clear plan.','Your live business snapshot, upcoming service commitments and team readiness.',`<button class="btn btn-secondary" data-action="export-report">${ico('download',15)} Export summary</button><button class="btn btn-primary" data-action="new-event">${ico('plus',15)} Create event</button>`)}
<div class="grid stats-grid">${statCard('Confirmed & active events',String(confirmed.length).padStart(2,'0'),`<span class="trend">${upcomingEvents().length} upcoming</span> across your calendar`,'calendar',74)}${statCard('Received this month',money(monthIncome),`<span class="trend">${state.transactions.filter(t=>t.type==='income'&&t.date.startsWith(monthKey)).length} receipts</span> recorded this month`,'wallet',62)}${statCard('Client balances due',money(out),`${state.events.filter(e=>eventBalance(e)>0&&e.status!=='Cancelled').length} bookings with a balance`,'receipt',43)}${statCard('Active team members',state.employees.filter(e=>e.status==='Active').length,`${low.length} inventory items need attention`,'users',81)}</div>
<div class="grid two-col"><section class="panel panel-pad">${panelHead('Cash flow at a glance','Recorded receipts and expenses · last 6 months',`<div class="tabs"><button class="tab active" data-action="chart-mode" data-mode="cash">Cash flow</button><button class="tab" data-action="chart-mode" data-mode="net">Net movement</button></div>`)}<div class="chart-legend"><span><i class="legend-dot" style="background:#2d7155"></i>Money in</span><span><i class="legend-dot" style="background:#d9a17c"></i>Money out</span></div><div class="chart-wrap"><canvas id="cashChart" aria-label="Six month cash flow chart"></canvas></div><div class="flex justify-between" style="border-top:1px solid #edf0ed;padding-top:13px;margin-top:4px"><div><div class="stat-label">Income recorded</div><strong style="font-size:15px">${money(state.transactions.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0))}</strong></div><div><div class="stat-label">Expenses recorded</div><strong style="font-size:15px">${money(state.transactions.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0))}</strong></div><div><div class="stat-label">Net movement</div><strong style="font-size:15px;color:var(--forest)">${money(state.transactions.reduce((a,t)=>a+(t.type==='income'?t.amount:-t.amount),0))}</strong></div></div></section>
<section class="panel panel-pad">${panelHead('Kitchen & operations watch','Items that need a decision today')}${low.length?low.slice(0,4).map(i=>`<div class="alert-card"><div class="alert-icon">${ico('alert',16)}</div><div style="flex:1"><strong>${escapeHtml(i.name)} · ${i.stock} ${escapeHtml(i.unit)} left</strong><p>Preferred minimum ${i.threshold} ${escapeHtml(i.unit)} · ${escapeHtml(i.supplier)}</p></div><button class="link-btn" data-action="purchase-stock" data-id="${i.id}">Restock</button></div>`).join(''):'<div class="subtle-note">Inventory levels look healthy. Keep purchases and upcoming events updated for an accurate forecast.</div>'}<div style="border-top:1px solid #edf1ed;margin-top:14px;padding-top:14px">${panelHead('Lead follow-up','Keep active conversations moving',`<button class="link-btn" data-page="clients">View leads →</button>`)}${state.enquiries.filter(q=>['New','Contacted'].includes(q.status)).slice(0,2).map(q=>`<div class="activity-item"><span class="activity-dot">${ico('message',15)}</span><div class="activity-text"><strong>${escapeHtml(q.name)}</strong><div>${escapeHtml(q.eventType)} · ${q.guests} guests · ${fmtShort(q.date)}</div><small>${escapeHtml(q.status)} · ${escapeHtml(q.source)}</small></div><button class="btn btn-secondary btn-sm" data-action="view-enquiry" data-id="${q.id}">Review</button></div>`).join('')||'<p class="muted" style="font-size:11px">No active lead follow-ups.</p>'}</div></section></div>
<div class="grid two-col mt-16"><section class="panel panel-pad">${panelHead('Coming up next','Your next confirmed and quoted events',`<button class="link-btn" data-page="events">Open calendar →</button>`)}${upcomingEvents().slice(0,5).map(e=>`<div class="event-row"><div class="date-chip"><strong>${new Date(e.date+'T00:00:00').getDate()}</strong><span>${new Date(e.date+'T00:00:00').toLocaleDateString('en-IN',{month:'short'})}</span></div><div class="event-main"><strong>${escapeHtml(e.title)}</strong><small>${escapeHtml(e.venue)} · ${e.guests} guests</small><div style="margin-top:6px">${badge(e.status)}</div></div><div class="event-meta"><strong>${money(eventTotal(e))}</strong><small>${escapeHtml(e.time)} · ${escapeHtml(clientName(e.clientId))}</small></div><button class="icon-btn btn-icon" data-action="view-event" data-id="${e.id}" title="Open event">${ico('chevron',15)}</button></div>`).join('')||'<div class="empty-state">No upcoming events recorded.</div>'}</section>
<section class="panel panel-pad">${panelHead('Recent activity','A running record of important changes',`<button class="link-btn" data-action="show-alerts">View all →</button>`)}${state.activity.slice(0,5).map(a=>`<div class="activity-item"><span class="activity-dot">${ico(a.icon||'check',15)}</span><div class="activity-text"><strong>${escapeHtml(a.title)}</strong><div>${escapeHtml(a.detail)}</div><small>${fmtShort(a.date)}</small></div></div>`).join('')}</section></div>
<div class="grid three-col mt-16"><section class="panel panel-pad">${panelHead('Event pipeline','Where upcoming work stands')}${[['Enquiry',state.events.filter(e=>e.status==='Enquiry').length,'#8fa9ce'],['Quotation',state.events.filter(e=>e.status==='Quotation').length,'#e1b96c'],['Confirmed',state.events.filter(e=>e.status==='Confirmed').length,'#76a88a'],['Completed',state.events.filter(e=>e.status==='Completed').length,'#9ab3a4']].map(([name,num,col])=>`<div class="progress-row"><div class="progress-label"><span>${name}</span><span>${num}</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,num/Math.max(1,state.events.length)*100)}%;background:${col}"></div></div></div>`).join('')}</section><section class="panel panel-pad">${panelHead('Staffing readiness','Active people by role')}${state.employees.filter(e=>e.status==='Active').slice(0,4).map(e=>`<div class="event-row"><div class="mini-avatar">${initials(e.name)}</div><div class="event-main"><strong>${escapeHtml(e.name)}</strong><small>${escapeHtml(e.role)}</small></div>${badge(e.availability||'Available')}</div>`).join('')}<button class="btn btn-secondary w-full mt-16" data-page="team">Manage team</button></section><section class="panel panel-pad">${panelHead('Business shortcuts','Get to common tasks quickly')}<div class="grid" style="grid-template-columns:1fr 1fr;gap:9px"><button class="btn btn-secondary" style="justify-content:flex-start;white-space:normal" data-action="new-quote">${ico('receipt',16)} Build quote</button><button class="btn btn-secondary" style="justify-content:flex-start;white-space:normal" data-action="new-client">${ico('users',16)} Add client</button><button class="btn btn-secondary" style="justify-content:flex-start;white-space:normal" data-action="new-menu">${ico('utensils',16)} Add dish</button><button class="btn btn-secondary" style="justify-content:flex-start;white-space:normal" data-action="new-expense">${ico('wallet',16)} Record cost</button></div><div class="subtle-note" style="margin-top:14px">Keep event details, stock usage and payments current so your reports reflect your actual operating position.</div></section></div>`}
function buildMonthlySeries(){const months=[];const now=new Date();for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;months.push({key,label:d.toLocaleDateString('en-IN',{month:'short'}),income:state.transactions.filter(t=>t.type==='income'&&t.date?.startsWith(key)).reduce((a,t)=>a+t.amount,0),expenses:state.transactions.filter(t=>t.type==='expense'&&t.date?.startsWith(key)).reduce((a,t)=>a+t.amount,0)})}return months}
function drawCashChart(mode='cash'){const c=$('#cashChart');if(!c)return;const ctx=c.getContext('2d'),rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=rect.width*dpr;c.height=rect.height*dpr;ctx.scale(dpr,dpr);const w=rect.width,h=rect.height,p={l:48,r:10,t:14,b:29};ctx.clearRect(0,0,w,h);const arr=buildMonthlySeries(),maxVal=Math.max(...arr.map(a=>mode==='net'?Math.abs(a.income-a.expenses):Math.max(a.income,a.expenses)),10000)*1.15;ctx.font='10px system-ui';ctx.fillStyle='#89958c';ctx.textAlign='right';ctx.strokeStyle='#edf1ed';ctx.lineWidth=1;for(let i=0;i<=4;i++){const y=p.t+(h-p.t-p.b)*i/4;ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(w-p.r,y);ctx.stroke();const val=maxVal*(4-i)/4;ctx.fillText(val>=100000?'₹'+(val/100000).toFixed(1)+'L':val>=1000?'₹'+Math.round(val/1000)+'k':'₹'+Math.round(val),p.l-8,y+3)}const chartH=h-p.t-p.b,chartW=w-p.l-p.r,step=chartW/arr.length;arr.forEach((a,i)=>{const center=p.l+step*i+step/2;if(mode==='net'){const value=a.income-a.expenses,base=p.t+chartH/2;ctx.strokeStyle='#e6ece7';ctx.beginPath();ctx.moveTo(p.l,base);ctx.lineTo(w-p.r,base);ctx.stroke();const bh=Math.abs(value)/maxVal*chartH*1.8;ctx.fillStyle=value>=0?'#477f61':'#d18a6c';ctx.beginPath();ctx.roundRect(center-step*.22,value>=0?base-bh:base,step*.44,bh,5);ctx.fill()}else{const bw=Math.min(17,step*.26),hi=a.income/maxVal*chartH,he=a.expenses/maxVal*chartH;ctx.fillStyle='#2d7155';ctx.beginPath();ctx.roundRect(center-bw-2,p.t+chartH-hi,bw,hi,4);ctx.fill();ctx.fillStyle='#d9a17c';ctx.beginPath();ctx.roundRect(center+2,p.t+chartH-he,bw,he,4);ctx.fill()}ctx.fillStyle='#7f8b82';ctx.textAlign='center';ctx.fillText(a.label,center,h-8)})}
function renderStorefront(){const b=state.business,showMenu=(storeMenuOverride===false?false:b.showMenu),showPortfolio=b.showPortfolio,showReviews=b.showReviews;const pics=state.reviews;return `<div class="storefront-toolbar"><div class="brand"><div class="brand-mark">${b.logoText?escapeHtml(b.logoText.slice(0,2)):'FF'}</div><div><div class="brand-name">${escapeHtml(b.name)}</div><div class="brand-sub">Catering · ${escapeHtml(b.city)}</div></div></div><nav class="public-nav"><a href="#services">Services</a>${showMenu?'<a href="#menus">Menus</a>':''}${showPortfolio?'<a href="#portfolio">Our work</a>':''}${showReviews?'<a href="#reviews">Reviews</a>':''}<a href="#contact">Contact</a></nav><div class="flex gap-8"><button class="btn btn-secondary btn-sm" data-action="share-store">${ico('copy',13)} Share</button><button class="btn btn-primary btn-sm" data-action="back-workspace">${ico('arrow',13)} Workspace</button></div></div>

3>${escapeHtml(m.name)}</h3><p>${escapeHtml(m.description)}</p><div class="price-line"><strong>${b.showPrices?money(m.price):'Request pricing'}</strong><span>${b.showPrices?'/ '+escapeHtml(m.unit):escapeHtml(m.unit)}</span></div><button class="btn btn-secondary w-full mt-16" data-action="enquire-dish" data-id="${m.id}">Ask about this item ${ico('arrow',13)}</button></div></article>`).join('')}</div><div class="section-center" style="margin-top:21px"><button class="btn btn-primary" data-action="customer-enquiry">Build a menu for my event ${ico('arrow',15)}</button></div></section>`:''}

t be greater than zero','error');return}it.stock=Number(it.stock)+qty;it.unitCost=cost;it.supplier=d.supplier;it.lastPurchase=d.date;state.transactions.unshift({id:uid('T'),type:'expense',category:it.category==='Packaging'?'Packaging':'Ingredients',description:`Stock purchase — ${it.name}${d.notes?' · '+d.notes:''}`,amount:qty*cost,date:d.date,eventId:'',clientId:'',method:d.method});addActivity('Inventory purchase received',`${qty} ${it.unit} ${it.name} · ${money(qty*cost)}`,'box');persist();modalClose();renderPage();toast('Stock updated and expense recorded')},{submitLabel:'Receive stock',onOpen:()=>{const upd=()=>{const f=$('#modalForm'),q=Number(f.elements.quantity?.value)||0,c=Number(f.elements.unitCost?.value)||0;if($('#purchaseQty'))$('#purchaseQty').textContent=`${q}`;if($('#purchaseTotal'))$('#purchaseTotal').textContent=money(q*c)};$('#modalBody').addEventListener('input',e=>{if(e.target.matches('[data-purchase-calc]'))upd()});$('#purchaseItemSelect')?.addEventListener('change',()=>{const selected=state.inventory.find(x=>x.id===$('#purchaseItemSelect').value);if(selected){$('#modalForm').elements.supplier.value=selected.supplier||'';$('#modalForm').elements.unitCost.value=selected.unitCost||0;upd()}});upd()}})}
function openTransactionForm(type='expense',txnId=null,defaults={}){const t=txnId?state.transactions.find(x=>x.id===txnId):null;const isIncome=type==='income';const body=`<input type="hidden" name="id" value="${escapeHtml(t?.id||'')}"><input type="hidden" name="type" value="${isIncome?'income':'expense'}"><div class="form-grid">${field('Description','description',t?.description||defaults.description||'','text',{required:true,full:true})}${field('Category','category',t?.category||(isIncome?'Client payment':'Ingredients'),'select',{options:(isIncome?['Client payment','Additional service','Other income','Refund reversal']:['Ingredients','Staff wages','Transport','Equipment rental','Packaging','Utilities','Venue / kitchen rent','Marketing','Maintenance','Other expense']).map(x=>({value:x,label:x}))})}${field('Amount (₹)','amount',t?.amount??defaults.amount??0,'number',{required:true,min:0.01,step:'0.01'})}${field('Date','date',t?.date||dateOffset(0),'date',{required:true})}${field('Linked event','eventId',t?.eventId||defaults.eventId||'','select',{options:[{value:'',label:'No linked event'},...state.events.filter(e=>e.status!=='Cancelled').map(e=>({value:e.id,label:e.title+' · '+fmtShort(e.date)}))]})}${field('Payment method','method',t?.method||'UPI','select',{options:['UPI','Bank transfer','Cash','Card','Credit / payable','Other'].map(x=>({value:x,label:x}))})}${field('Notes / reference','notes',t?.notes||'','text',{full:true})}</div>`;modalOpen(t?'Edit transaction':isIncome?'Record income':'Record expense',t?'Update the ledger record.':'Record the movement of money with a category and date.',body,form=>{const d=Object.fromEntries(new FormData(form).entries()),old=t?Number(t.amount)||0:0;d.amount=Number(d.amount)||0;d.clientId=eventById(d.eventId)?.clientId||'';d.id=t?.id||uid('T');if(d.amount<=0){toast('Enter an amount greater than zero','error');return}if(t){if(t.type==='income'&&t.eventId){const oldEv=eventById(t.eventId);if(oldEv)oldEv.paid=Math.max(0,(Number(oldEv.paid)||0)-old)}Object.assign(t,d);if(t.type==='income'&&t.eventId){const ev=eventById(t.eventId);if(ev)ev.paid=(Number(ev.paid)||0)+d.amount}}else{state.transactions.unshift(d);if(d.type==='income'&&d.eventId){const ev=eventById(d.eventId);if(ev)ev.paid=(Number(ev.paid)||0)+d.amount}}addActivity(t?'Transaction updated':'Transaction recorded',`${isIncome?'Income':'Expense'} · ${money(d.amount)} · ${d.description}`,'wallet');persist();modalClose();renderPage();toast(t?'Transaction updated':'Transaction recorded')},{submitLabel:t?'Save transaction':isIncome?'Record income':'Record expense'})}
function openPaymentForm(eventId){const ev=eventById(eventId);if(!ev)return;const body=`<input type="hidden" name="eventId" value="${ev.id}"><div class="subtle-note" style="margin-bottom:15px"><strong>${escapeHtml(ev.title)}</strong><br>Client: ${escapeHtml(clientName(ev.clientId))}<br>Quotation total: ${money(eventTotal(ev))} · Received to date: ${money(ev.paid)} · Balance: ${money(eventBalance(ev))}</div><div class="form-grid">${field('Payment amount (₹)','amount',eventBalance(ev),'number',{required:true,min:0.01,step:'0.01'})}${field('Receipt date','date',dateOffset(0),'date',{required:true})}${field('Payment method','method','UPI','select',{options:['UPI','Bank transfer','Cash','Card','Cheque','Other'].map(x=>({value:x,label:x}))})}${field('Reference / remarks','description',`Client payment — ${ev.title}`,'text',{full:true,required:true})}</div>`;modalOpen('Record client payment','Save a receipt against this event. The event balance will update immediately.',body,form=>{const d=Object.fromEntries(new FormData(form).entries()),e=eventById(d.eventId),amount=Number(d.amount)||0;if(!e||amount<=0){toast('Enter a valid payment amount','error');return}if(amount>eventBalance(e)+0.005){toast('Payment exceeds the remaining balance. Adjust the receipt amount.','error');return}e.paid=(Number(e.paid)||0)+amount;state.transactions.unshift({id:uid('T'),type:'income',category:'Client payment',description:d.description,amount,date:d.date,eventId:e.id,clientId:e.clientId,method:d.method});addActivity('Client payment recorded',`${clientName(e.clientId)} · ${money(amount)} · ${e.title}`,'wallet');persist();modalClose();renderPage();toast(`Payment of ${money(amount)} recorded`)},{submitLabel:'Save receipt'})}
function openEnquiryForm(qid=null,defaults={}){const q=qid?state.enquiries.find(x=>x.id===qid):null;const body=`<input type="hidden" name="id" value="${escapeHtml(q?.id||'')}"><div class="form-grid">${field('Contact / organisation','name',q?.name||defaults.name||'','text',{required:true})}${field('Phone','phone',q?.phone||'','tel',{required:true})}${field('Email','email',q?.email||'','email')}${field('Event type','eventType',q?.eventType||defaults.type||'Wedding','select',{options:['Wedding','Reception','Engagement','Birthday','Housewarming','Corporate','Festival','Other'].map(x=>({value:x,label:x}))})}${field('Requested date','date',q?.date||defaults.date||dateOffset(14),'date',{required:true})}${field('Estimated guest count','guests',q?.guests||defaults.guests||100,'number',{required:true,min:1})}${field('Budget (₹)','budget',q?.budget||0,'number',{min:0,step:'0.01'})}${field('Enquiry source','source',q?.source||'Website','select',{options:['Website','WhatsApp','Instagram','Google Maps','Referral','Phone call','Repeat client','Other'].map(x=>({value:x,label:x}))})}${field('Lead status','status',q?.status||'New','select',{options:['New','Contacted','Quoted','Converted','Lost'].map(x=>({value:x,label:x}))})}${field('Requirements / client message','message',q?.message||'','textarea',{full:true,rows:4})}</div>`;modalOpen(q?'Edit enquiry':'Log an enquiry',q?'Update lead details and follow-up status.':'Capture a customer request before preparing a quotation.',body,form=>{const d=Object.fromEntries(new FormData(form).entries());d.guests=Number(d.guests)||0;d.budget=Number(d.budget)||0;d.id=q?.id||uid('Q');d.created=q?.created||dateOffset(0);if(q)Object.assign(q,d);else state.enquiries.unshift(d);persist();modalClose();renderPage();toast(q?'Enquiry updated':'Enquiry added');addActivity(q?'Enquiry updated':'New lead recorded',d.name+' · '+d.eventType,'message')},{submitLabel:q?'Save enquiry':'Log enquiry'})}
function openReviewForm(id=null){const r=id?state.reviews.find(x=>x.id===id):null;const body=`<input type="hidden" name="id" value="${escapeHtml(r?.id||'')}"><div class="form-grid">${field('Reviewer / customer','name',r?.name||'','text',{required:true})}${field('Event / service','event',r?.event||'Wedding catering','text',{required:true})}${field('Rating','rating',r?.rating||5,'select',{options:[5,4,3,2,1].map(n=>({value:n,label:`${n} out of 5 stars`}))})}${field('Review date','date',r?.date||dateOffset(0),'date',{required:true})}${field('Verified booking?','verified',r?!!r.verified:true,'checkbox',{checkText:'Review relates to a recorded booking',full:true})}${field('Customer feedback','text',r?.text||'','textarea',{full:true,rows:4,required:true})}${field('Owner response','reply',r?.reply||'','textarea',{full:true,rows:2})}</div>`;modalOpen(r?'Manage review':'Add guest review','Store the review and an optional owner response for storefront publication.',body,form=>{const d=Object.fromEntries(new FormData(form).entries());d.rating=Number(d.rating)||5;d.verified=form.elements.verified.checked;d.id=r?.id||uid('R');if(r)Object.assign(r,d);else state.reviews.unshift(d);persist();modalClose();renderPage();toast(r?'Review updated':'Review added')},{submitLabel:r?'Save review':'Add review'})}
function eventDetailMarkup(e){const sub=eventSubtotal(e),total=eventTotal(e),tax=total-sub,pack=currentPackage(e.packageId),client=currentClient(e.clientId);return `<div class="grid two-col" style="gap:12px;margin-bottom:17px"><div class="report-box"><label>Quotation total</label><strong>${money(total)}</strong><small>${money(e.paid)} received · ${eventCredit(e)>0?money(eventCredit(e))+' client credit':money(eventBalance(e))+' balance due'}</small></div><div class="report-box"><label>Event stage</label><div style="margin:12px 0 8px">${badge(e.status)}</div><small>${e.guests.toLocaleString('en-IN')} expected guests · ${fmtDate(e.date)}</small></div></div><div class="form-grid"><div class="form-section-title">Event & customer</div><div class="field"><label>Event</label><div style="font-size:12px;font-weight:750">${escapeHtml(e.title)}</div><span class="hint">${escapeHtml(e.type)}</span></div><div class="field"><label>Client</label><div style="font-size:12px;font-weight:750">${escapeHtml(client?.name||'—')}</div><span class="hint">${escapeHtml(client?.phone||'')} · ${escapeHtml(client?.email||'')}</span></div><div class="field"><label>Date and time</label><div style="font-size:12px;font-weight:700">${fmtDate(e.date)}</div><span class="hint">${escapeHtml(e.time)}–${escapeHtml(e.endTime||'—')}</span></div><div class="field"><label>Venue</label><div style="font-size:12px;font-weight:700">${escapeHtml(e.venue)}</div><span class="hint"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.venue)}">Open directions ↗</a></span></div><div class="field"><label>Package / menu</label><div style="font-size:12px;font-weight:700">${escapeHtml(pack?.name||'Custom catering')}</div><span class="hint">${escapeHtml(pack?.cuisine||'Mixed')} · ${money(e.rate)} per guest</span></div><div class="field"><label>Guest count</label><div style="font-size:12px;font-weight:700">${e.guests.toLocaleString('en-IN')} guests</div><span class="hint">Service type: ${escapeHtml(e.type)}</span></div><div class="form-section-title">Quotation components</div><div class="field full"><div class="calc-box"><div class="calc-line"><span>Food package (${e.guests} × ${money(e.rate)})</span><strong>${money(e.guests*e.rate)}</strong></div>${(e.menuSelections||[]).map(sel=>{const m=state.menus.find(z=>z.id===sel.menuId);if(!m)return '';const perGuest=/per guest|per plate/i.test(m.unit||''),qty=Number(sel.quantity)||0;return `<div class="calc-line"><span>${escapeHtml(m.name)} · ${qty}${perGuest?' × '+e.guests+' guests':''}</span><strong>${money((Number(m.price)||0)*qty*(perGuest?e.guests:1))}</strong></div>`}).join('')}<div class="calc-line"><span>Additional menu / services</span><strong>${money(e.extras)}</strong></div><div class="calc-line"><span>Staffing and labour</span><strong>${money(e.staffCost)}</strong></div><div class="calc-line"><span>Transport & delivery</span><strong>${money(e.transport)}</strong></div><div class="calc-line"><span>Equipment / rentals</span><strong>${money(e.rentals)}</strong></div><div class="calc-line"><span>Other charges</span><strong>${money(e.other)}</strong></div><div class="calc-line"><span>Discount</span><strong>−${money(e.discount)}</strong></div><div class="calc-line"><span>Subtotal</span><strong>${money(sub)}</strong></div><div class="calc-line"><span>Configured tax (${Number(e.taxRate)||0}%)</span><strong>${money(tax)}</strong></div><div class="calc-line total"><span>Total</span><strong>${money(total)}</strong></div><div class="calc-line"><span>Received</span><strong>${money(e.paid)}</strong></div><div class="calc-line"><span>${eventCredit(e)>0?'Client credit':'Balance due'}</span><strong>${money(eventCredit(e)>0?eventCredit(e):eventBalance(e))}</strong></div></div></div><div class="form-section-title">Crew plan (${(e.staffAssignments||[]).length} assigned)</div><div class="field full">${(e.staffAssignments||[]).map(a=>{const emp=state.employees.find(x=>x.id===a.employeeId);return `<div class="event-row"><div class="mini-avatar">${initials(emp?.name||'Staff')}</div><div class="event-main"><strong>${escapeHtml(emp?.name||'Unknown employee')} · ${escapeHtml(a.role||emp?.role||'Crew')}</strong><small>${escapeHtml(a.startTime||e.time)}–${escapeHtml(a.endTime||e.endTime)} · ${(a.tasks||[]).filter(t=>t.done).length}/${(a.tasks||[]).length} tasks complete</small></div>${badge(a.checkedIn?'Checked in':a.status||'Assigned')}</div>`}).join('')||'<p class="muted" style="font-size:11px">No staff assignments are recorded yet.</p>'}<button class="btn btn-secondary btn-sm" style="margin-top:10px" type="button" data-action="assign-event" data-id="${e.id}">${ico('users',13)} Manage staff allocation</button></div><div class="form-section-title">Client instructions</div><div class="field full"><div class="subtle-note">${escapeHtml(e.notes||'No special instructions recorded.')}</div></div></div>`}
function openEventDetail(id){const e=eventById(id);if(!e)return;modalOpen(e.title,`${e.id} · ${fmtDate(e.date)} · ${e.guests} guests`,eventDetailMarkup(e),null,{wide:true,viewOnly:true,footer:`<button type="button" class="btn btn-secondary" data-action="close-modal">Close</button><div class="right-actions"><button type="button" class="btn btn-secondary" data-action="record-payment" data-id="${e.id}">${ico('wallet',14)} Record payment</button><button type="button" class="btn btn-secondary" data-action="open-quote" data-id="${e.id}">${ico('receipt',14)} View quote</button><button type="button" class="btn btn-primary" data-action="edit-event" data-id="${e.id}">${ico('edit',14)} Edit event</button></div>`})}
function quoteHtml(e){const b=state.business,c=currentClient(e.clientId),pack=currentPackage(e.packageId),sub=eventSubtotal(e),total=eventTotal(e),tax=total-sub;return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quotation QT-${e.id.replace('EV','')} · ${escapeHtml(b.name)}</title><style>body{font-family:Arial,sans-serif;color:#26382d;margin:0;background:#f3f6f3;font-size:13px}.sheet{max-width:850px;margin:30px auto;background:white;padding:42px 48px;box-shadow:0 10px 50px #0001}.top{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #214938;padding-bottom:24px}.logo{font-family:Georgia,serif;font-size:25px;color:#214938;font-weight:bold}.muted{color:#79877e;font-size:11px;line-height:1.7}.right{text-align:right}.title{margin:28px 0 20px;display:flex;justify-content:space-between;align-items:end}.title h1{margin:0;font-size:28px}.badge{display:inline-block;background:#e8f3ea;color:#2c6b44;padding:5px 9px;border-radius:6px;font-size:10px;font-weight:bold}.details{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:26px}.details h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#829087;margin:0 0 9px}.details strong{display:block;margin:5px 0}.details p{margin:4px 0;color:#657268}.rows{width:100%;border-collapse:collapse}.rows th{text-align:left;color:#829087;font-size:10px;text-transform:uppercase;border-bottom:1px solid #e2eae3;padding:11px 8px}.rows td{padding:12px 8px;border-bottom:1px solid #edf1ed}.rows th:last-child,.rows td:last-child{text-align:right}.totals{width:310px;margin:17px 0 0 auto}.line{display:flex;justify-content:space-between;padding:7px 0;color:#67776b}.line.total{border-top:2px solid #214938;font-weight:bold;font-size:17px;color:#214938;margin-top:5px;padding-top:12px}.terms{background:#f5f8f5;border-radius:9px;padding:15px;margin-top:25px;color:#69796e;font-size:11px;line-height:1.8}.footer{margin-top:28px;border-top:1px solid #e4ebe5;padding-top:16px;display:flex;justify-content:space-between;gap:15px;color:#859188;font-size:10px}@media(max-width:600px){.sheet{padding:20px;margin:0}.top,.details,.title{flex-direction:column}.right{text-align:left}.totals{width:100%}}@media print{body{background:white}.sheet{margin:0;box-shadow:none;max-width:none;padding:20px 25px}}</style></head><body><main class="sheet"><header class="top"><div><div class="logo">${escapeHtml(b.name)}</div><div class="muted">${escapeHtml(b.tagline||'Catering with care')}<br>${escapeHtml(b.address)}, ${escapeHtml(b.city)}, ${escapeHtml(b.state)} ${escapeHtml(b.pincode)}<br>${escapeHtml(b.phone)} · ${escapeHtml(b.email)}</div></div><div class="right"><div style="font-weight:bold">QUOTATION</div><div class="muted">QT-${e.id.replace('EV','')}<br>Issued: ${fmtDate(dateOffset(0))}<br>Valid for ${Number(b.quoteValidity)||7} days</div></div></header><div class="title"><div><div class="muted">Prepared for</div><h1>${escapeHtml(c?.name||'Valued client')}</h1></div><span class="badge">${escapeHtml(e.status)}</span></div><section class="details"><div><h3>Event details</h3><strong>${escapeHtml(e.title)}</strong><p>${escapeHtml(e.type)} · ${fmtDate(e.date)}</p><p>${escapeHtml(e.time)}${e.endTime?' – '+escapeHtml(e.endTime):''} · ${e.guests} guests</p><p>${escapeHtml(e.venue)}</p></div><div><h3>Package & service</h3><strong>${escapeHtml(pack?.name||'Custom catering service')}</strong><p>${escapeHtml(pack?.description||'Custom menu and service selection')}</p><p>${escapeHtml(pack?.cuisine||'Mixed')} · ${money(e.rate)} per guest</p><p>${escapeHtml((pack?.includes||[]).join(', '))}</p></div></section><table class="rows"><thead><tr><th>Service description</th><th>Calculation</th><th>Amount</th></tr></thead><tbody><tr><td><strong>Food package</strong><div class="muted">${escapeHtml(pack?.name||'Catering menu')}</div></td><td>${e.guests} × ${money(e.rate)}</td><td>${money(e.guests*e.rate)}</td></tr>${menuSelectionQuoteRows(e)}<tr><td>Additional menu / service items</td><td>Flat / manual services</td><td>${money(e.extras)}</td></tr><tr><td>Staffing and labour</td><td>Event shift plan</td><td>${money(e.staffCost)}</td></tr><tr><td>Transport and delivery</td><td>Event location</td><td>${money(e.transport)}</td></tr><tr><td>Equipment and rentals</td><td>Selected equipment</td><td>${money(e.rentals)}</td></tr><tr><td>Other charges</td><td>As agreed</td><td>${money(e.other)}</td></tr><tr><td>Discount</td><td>Applied to this quote</td><td>−${money(e.discount)}</td></tr></tbody></table><div class="totals"><div class="line"><span>Subtotal</span><strong>${money(sub)}</strong></div><div class="line"><span>Tax (${Number(e.taxRate)||0}%)</span><strong>${money(tax)}</strong></div><div class="line total"><span>Total</span><strong>${money(total)}</strong></div><div class="line"><span>Advance / received</span><strong>${money(e.paid)}</strong></div><div class="line"><span>${eventCredit(e)>0?'Client credit':'Balance remaining'}</span><strong>${money(eventCredit(e)>0?eventCredit(e):eventBalance(e))}</strong></div></div><div class="terms"><strong>Booking and service notes</strong><br>${escapeHtml(e.notes||'Menu quantities and service details will be reconfirmed before event day.')}<br><br><strong>Payment terms</strong><br>Requested advance: ${Number(b.advancePercent)||30}% of the confirmed booking value, unless otherwise agreed. ${escapeHtml(b.bankNote||'Payment details will be shared on confirmation.')}<br><br>This quotation is based on the guest count and services shown above. Changes to guest count, menu or venue timing may affect the final amount. Applicable tax treatment should be confirmed before issuing a final tax invoice.</div><footer class="footer"><span>Thank you for considering ${escapeHtml(b.name)}.</span><span>${escapeHtml(b.website||'')} · ${escapeHtml(b.email)}</span></footer></main><script>window.addEventListener('load',()=>{setTimeout(()=>window.print(),350)})<\/script></body></html>`}

function calendarMarkup(){const first=new Date(selectedYear,selectedMonth,1),last=new Date(selectedYear,selectedMonth+1,0),start=(first.getDay()+6)%7,total=Math.ceil((start+last.getDate())/7)*7;let html=`<div class="flex justify-between align-center" style="margin-bottom:14px"><button type="button" class="btn btn-secondary btn-sm" data-action="calendar-prev">← Previous</button><strong>${first.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</strong><button type="button" class="btn btn-secondary btn-sm" data-action="calendar-next">Next →</button></div><div class="calendar-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="calendar-cell head">${x}</div>`).join('')}`;for(let i=0;i<total;i++){const day=i-start+1,inMonth=day>=1&&day<=last.getDate(),date=`${selectedYear}-${String(selectedMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const evs=inMonth?state.events.filter(e=>e.date===date&&e.status!=='Cancelled'):[];html+=`<div class="calendar-cell" style="${!inMonth?'background:#fafbfa;opacity:.4':''}"><div class="flex justify-between align-center"><span class="day-num">${inMonth?day:''}</span>${inMonth?`<button type="button" style="border:0;background:none;color:#829087;padding:0;font-size:14px" data-action="calendar-add" data-date="${date}" title="Add event">+</button>`:''}</div>${evs.map(e=>`<button type="button" class="calendar-event ${['Enquiry','Quotation','Negotiation'].includes(e.status)?'pending':e.type==='Corporate'?'other':''}" title="${escapeHtml(e.title)}" data-action="view-event" data-id="${e.id}">${escapeHtml(e.title)}</button>`).join('')}</div>`}html+='</div><div class="flex gap-8" style="margin-top:13px;flex-wrap:wrap;font-size:10px;color:#7e8a82"><span><i class="legend-dot" style="background:#76a88a"></i>Confirmed / completed</span><span><i class="legend-dot" style="background:#e1b96c"></i>Enquiry / quotation</span><span><i class="legend-dot" style="background:#d99c7b"></i>Corporate / other events</span></div>';r function bindFileUpload(fileId,hiddenId){const input=$('#'+fileId),hidden=$('#'+hiddenId);if(!input||!hidden)return;input.addEventListener('change',async()=>{const file=input.files?.[0];if(!file)return;try{const url=await compressImage(file,1200,850,.76);hidden.value=url;toast('Photo ready to save')}catch(e){toast('Could not read that image. Try another file.','error')}})}
function bindMultiFileUpload(fileId,hiddenId){const input=$('#'+fileId),hidden=$('#'+hiddenId);if(!input||!hidden)return;input.addEventListener('change',async()=>{const files=Array.from(input.files||[]);if(!files.length)return;try{const urls=[];for(const file of files.slice(0,8))urls.push(await compressImage(file,1200,850,.74));let old=[];try{old=JSON.parse(hidden.value||'[]')}catch(e){}hidden.value=JSON.stringify([...old,...urls]);toast(`${urls.length} photo${urls.length===1?'':'s'} ready to save`)}catch(e){toast('Could not load one of these images. Try another file.','error')}})}
function compressImage(file,maxW=1200,maxH=850,quality=.75){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const scale=Math.min(1,maxW/img.width,maxH/img.height),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',quality))};img.src=reader.result};reader.readAsDataURL(file)})}

function openShareOptions(){const b=state.business;const body=`<div class="share-option-grid"><button type="button" class="share-option" data-action="share-store-full"><span class="share-option-icon">${ico('utensils',20)}</span><strong>Portfolio + menus</strong><small>Show services, event galleries, reviews, dishes, package prices and contact details.</small><span class="share-option-link">Copy storefront link ${ico('arrow-up-right',13)}</span></button><button type="button" class="share-option" data-action="share-store-portfolio"><span class="share-option-icon">${ico('images',20)}</span><strong>Portfolio without menus</strong><small>Show the business story, services, event galleries, reviews and contact details.</small><span class="share-option-link">Copy portfolio link ${ico('arrow-up-right',13)}</span></button></div><div class="subtle-note mt-16">This file creates a local preview address. To let clients open the link on their own devices, publish the page to a web host and connect shared storage for enquiries and edits.</div>`;modalOpen('Share your storefront',`Choose what ${escapeHtml(b.name)} would like to share.`,body,null,{viewOnly:true,wide:true,footer:`<button type="button" class="btn btn-secondary" data-action="close-modal">Close</button>`})}function copyStoreAddress(portfolioOnly=false){modalClose();const url=location.href.split('#')[0]+(portfolioOnly?'#storefront-no-menu':'#storefront');try{if(navigator.clipboard?.writeText){navigator.clipboard.writeText(url).then(()=>toast('Link copied. Public access requires hosting this page.')).catch(()=>fallbackCopy(url))}else fallbackCopy(url)}catch(e){fallbackCopy(url)}}function openPublicReview(){const options=[{value:'',label:'Select the service you attended'},...state.events.filter(e=>e.status==='Completed').map(e=>({value:e.title,label:`${e.title} · ${e.type}`})),{value:'General experience',label:'General experience'}];const body=`<div class="form-grid">${field('Your name','name','','text',{required:true})}${fi function drawCanvasChart(id){const c=$('#'+id);if(!c)return;const ctx=c.getContext('2d'),rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(1,rect.width*dpr);c.height=Math.max(1,rect.height*dpr);ctx.scale(dpr,dpr);const w=rect.width,h=rect.height,p={l:48,r:8,t:15,b:27};ctx.clearRect(0,0,w,h);const arr=buildMonthlySeries(),max=Math.max(...arr.map(a=>Math.max(a.income,a.expenses)),10000)*1.15,hh=h-p.t-p.b,ww=w-p.l-p.r;ctx.font='10px system-ui';ctx.textAlign='right';ctx.fillStyle='#89958c';for(let i=0;i<=4;i++){const y=p.t+hh*i/4;ctx.strokeStyle='#edf1ed';ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(w-p.r,y);ctx.stroke();const v=max*(4-i)/4;ctx.fillText(v>=100000?'₹'+(v/100000).toFixed(1)+'L':v>=1000?'₹'+Math.round(v/1000)+'k':'₹'+Math.round(v),p.l-7,y+3)}const step=ww/arr.length;arr.forEach((a,i)=>{const x=p.l+step*i+step/2,bw=Math.min(17,step*.25),hi=a.income/max*hh,he=a.expenses/max*hh;ctx.fillStyle='#2d7155';ctx.beginPath();ctx.roundRect(x-bw-2,p.t+hh-hi,bw,hi,4);ctx.fill();ctx.fillStyle='#d9a17c';ctx.beginPath();ctx.roundRect(x+2,p.t+hh-he,bw,he,4);ctx.fill();ctx.textAlign='center';ctx.fillStyle='#7f8b82';ctx.fillText(a.label,x,h-8)})}
function drawDonut(){const c=$('#donutChart');if(!c)return;const ctx=c.getContext('2d'),data=expenseBreakdown(),sum=data.reduce((a,x)=>a+x.amount,0),colors=['#2d7155','#c56e4e','#d5ad63','#7b9fbd','#7d8f83','#b7a3cb','#d7b1a0'];ctx.clearRect(0,0,c.width,c.height);let start=-Math.PI/2;data.forEach((x,i)=>{const ang=sum?x.amount/sum*Math.PI*2:0;ctx.beginPath();ctx.arc(75,75,58,start,start+ang);ctx.strokeStyle=colors[i%colors.length];ctx.lineWidth=18;ctx.stroke();start+=ang});ctx.fillStyle='#253b2e';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(money(sum).replace('₹','₹'),75,69);ctx.font='9px system-ui';ctx.fillStyle='#859087';ctx.fillText('EXPENSES',75,86)}

const ffBaseHandleAction=handleAction;handleAction=function(action,el){
  if(action==='bulk-import'){openBulkImport(el?.dataset.entity||'menus');return;}
  if(action==='download-import-template'){downloadImportTemplate(el?.dataset.entity||importEntity);return;}
  if(action==='download-import-errors'){downloadImportErrors();return;}
  if(action==='open-onboarding'){openOnboarding();return;}
  if(action==='onboarding-next'){if(ffCaptureOnboardingStep()){onboardingStep=Math.min(2,onboardingStep+1);ffPaintOnboardingStep();}return;}
  if(action==='onboarding-back'){if(ffCaptureOnboardingStep()){onboardingStep=Math.max(0,onboardingStep-1);ffPaintOnboardingStep();}return;}
  if(action==='account-access'){openAccountAccess('signup');return;}
  if(action==='account-mode'){accountPrototypeMode=el.dataset.mode||'signup';ffPaintAccountAccess();return;}
  if(action==='event-run-sheet'){modalClose();openEventRunSheet(el.dataset.id);return;}
  if(action==='print-run-sheet'){ffPrintRunSheet(el.dataset.id);return;}
  if(action==='record-stock-usage'){modalClose();openStockUsageForm();return;}
  if(action==='new-leave-request'){modalClose();openLeaveForm();return;}
  return ffBaseHandleAction(action,el);
};

function ffSignOut(){if(ffActiveOrgId)ffPersistWorkspace();if(ffCurrentUser)ffLog('Sign out','User ended local demo session',ffCurrentUser.email,'info');localStorage.removeItem(FF_SESSION_KEY);ffCurrentUser=null;ffActiveOrgId='';modalClose();ffApplyRoleUi();ffAuthView('login');}
function ffFindUser(email){return ffUsers.find(u=>String(u.email||'').trim().toLowerCase()===String(email||'').trim().toLowerCase())}
function ffCreateSignupAccount(form){const fd=new FormData(form),name=String(fd.get('name')||'').trim(),businessName=String(fd.get('businessName')||'').trim(),email=String(fd.get('email')||'').trim().toLowerCase(),password=String(fd.get('password')||''),confirmPassword=String(fd.get('confirmPassword')||''),role=String(fd.get('role')||'owner'),selectedOrg=String(fd.get('orgId')||'');if(!name||!email||!password)return toast('Complete all required fields.','error');if(password.length<6)return toast('Use at least 6 characters for this demo password.','error');if(password!==confirmPassword)return toast('Passwords do not match.','error');if(ffFindUser(email))return toast('An account with this email already exists. Sign in instead.','error');if(!['owner','manager','employee','customer'].includes(role))return toast('Choose a valid account type.','error');
  let orgId=selectedOrg,org=null;
  if(role==='owner'){if(!businessName)return toast('Enter a business name for the new owner account.','error');orgId=uid('ORG');org={id:orgId,name:businessName,ownerEmail:email,plan:'Starter',status:'Trial',createdAt:new Date().toISOString()};ffOrgs.unshift(org);ffSaveOrgs();const sample=fd.get('workspaceMode')==='sample',w=ffDefaultWorkspace(businessName,name,email,sample);ffWriteJson('feastflow_workspace_'+orgId,w);}
  else {org=ffOrgs.find(o=>o.id===orgId);if(!orgId||!org)return toast('Choose an existing business for this account type.','error');if(org.status==='Suspended')return toast('That business workspace is suspended.','error');}
  const user={id:uid('U'),name,email,password,role,orgId,businessName:org?.name||businessName||'',plan:org?.plan||'Starter',status:'Active',createdAt:new Date().toISOString(),lastLogin:'',lastActive:'',isSeeded:false};ffUsers.unshift(user);ffSaveUsers();ffLog('Account created',`${name} created a ${role} account${org?' for '+org.name:''}`,email,'success');
  ffStartSession(user,{showOnboarding:role==='owner'});
}
function ffCreateAdminUserForm(){
  const orgOptions=ffOrgs.map(o=>({value:o.id,label:`${o.name} · ${o.status}`}));
  const body=`<div class="alert-card"><div><strong>Prototype account creation</strong><p>This adds a local account and demo password in this browser. It does not send an invite or create a secure hosted identity.</p></div></div><div class="form-grid" style="margin-top:14px">${field('Full name','adminUserName','','text',{required:true})}${field('Email address','adminUserEmail','','email',{required:true})}${field('Role','adminUserRole','owner','select',{required:true,options:[{value:'owner',label:'Business owner'},{value:'manager',label:'Manager'},{value:'employee',label:'Employee'},{value:'customer',label:'Customer'}]})}${field('Temporary demo password','adminUserPassword','','text',{required:true,hint:'At least 6 characters. Share manually for prototype testing.'})}<div class="form-section-title">Business assignment</div>${field('New business name (for an owner)','adminBusinessName','','text',{hint:'Required when creating a new business owner account.'})}${field('Existing business (for manager, employee or customer)','adminOrgId',orgOptions[0]?.value||'','select',{options:[{value:'',label:'No business / choose later'},...orgOptions]})}${field('Subscription plan','adminUserPlan','Starter','select',{options:['Free','Starter','Professional','Enterprise']})}</div>`;
  modalOpen('Create user account','Add a business owner, manager, employee or customer to this prototype.',body,form=>{
    const fd=new FormData(form),name=String(fd.get('adminUserName')||'').trim(),email=String(fd.get('adminUserEmail')||'').trim().toLowerCase(),role=String(fd.get('adminUserRole')||'owner'),password=String(fd.get('adminUserPassword')||''),businessName=String(fd.get('adminBusinessName')||'').trim(),plan=String(fd.get('adminUserPlan')||'Starter');let orgId=String(fd.get('adminOrgId')||'');
    if(!name||!email||!password){toast('Name, email and temporary password are required.','error');return}if(password.length<6){toast('Use at least 6 characters for the demo password.','error');return}if(ffFindUser(email)){toast('That email is already registered.','error');return}
    if(role==='owner'){if(!businessName){toast('Enter a business name for the new owner.','error');return}orgId=uid('ORG');ffOrgs.unshift({id:orgId,name:businessName,ownerEmail:email,plan,status:'Trial',createdAt:new Date().toISOString()});ffWriteJson('feastflow_workspace_'+orgId,ffDefaultWorkspace(businessName,name,email,false));ffSaveOrgs();}
    else if(orgId&&!ffOrgs.some(o=>o.id===orgId)){toast('Choose an existing business.','error');return}
    const org=ffOrgs.find(o=>o.id===orgId);const u={id:uid('U'),name,email,password,role,orgId,businessName:org?.name||businessName||'',plan:org?.plan||plan,status:'Active',createdAt:new Date().toISOString(),lastLogin:'',lastActive:'',isSeeded:false};ffUsers.unshift(u);ffSaveUsers();if(org&&role==='owner'){org.ownerEmail=email;org.plan=plan;ffSaveOrgs()}ffLog('Account created by Superadmin',`${ffRoleLabel(role)} account created${org?' for '+org.name:''}`,ffCurrentUser?.email||'superadmin@feastflow.demo','success');modalClose();renderPage();toast(`Created ${role} account for ${email}`);
  },{wide:true,submitLabel:'Create account'});
}
function ffAdminWorkspaceStats(orgId){const w=ffReadJson('feastflow_workspace_'+orgId,null)||(orgId===ffActiveOrgId?state:null);return {events:w?.events?.length||0,clients:w?.clients?.length||0,staff:w?.employees?.length||0,menus:w?.menus?.length||0}}
function ffLocalStorageBytes(){let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);n+=(k.length+(localStorage.getItem(k)||'').length)*2}}catch(_){}return n}
function ffAdminOverview(){
  const activeUsers=ffUsers.filter(u=>u.status!=='Suspended').length,suspendedUsers=ffUsers.length-activeUsers,activeOrgs=ffOrgs.filter(o=>o.status==='Active'||o.status==='Trial').length,events=ffOrgs.reduce((n,o)=>n+ffAdminWorkspaceStats(o.id).events,0),monthly=ffUsers.filter(u=>u.role!=='superadmin'&&u.status!=='Suspended').length;
  const byPlan=['Free','Starter','Professional','Enterprise'].map(p=>({name:p,count:ffOrgs.filter(o=>o.plan===p).length}));
  return `<div class="grid stats-grid" style="grid-template-columns:repeat(4,minmax(0,1fr))"><div class="ff-admin-stat"><div class="label">Registered users</div><div class="value">${ffUsers.length}</div><small>Owner, manager, employee, customer & admin</small></div><div class="ff-admin-stat"><div class="label">Active accounts</div><div class="value">${activeUsers}</div><small>${suspendedUsers} suspended account${suspendedUsers===1?'':'s'}</small></div><div class="ff-admin-stat"><div class="label">Business workspaces</div><div class="value">${ffOrgs.length}</div><small>${activeOrgs} active or on trial</small></div><div class="ff-admin-stat"><div class="label">Events across saved workspaces</div><div class="value">${events}</div><small>Browser-local aggregation only</small></div></div><div class="grid two-col" style="margin-top:17px"><section class="ff-admin-section"><div class="section-head"><div><h3>Platform activity</h3><p>Recent sign-ins, account changes and workspace events</p></div><button class="link-btn" data-action="admin-tab" data-tab="activity">View activity →</button></div><div class="ff-admin-pad">${ffAudit.slice(0,7).map(x=>`<div class="activity-item"><div class="activity-dot">${ico(x.kind==='success'?'check':x.kind==='system'?'settings':'users',15)}</div><div class="activity-text"><strong>${ffEsc(x.action)}</strong><div>${ffEsc(x.detail||'')}</div><small>${ffEsc(x.userEmail||'system')} · ${ffEsc(new Date(x.at).toLocaleString('en-IN'))}</small></div></div>`).join('')||'<div class="ff-admin-empty">No activity recorded yet.</div>'}</div></section><section class="ff-admin-section"><div class="section-head"><div><h3>Subscription distribution</h3><p>Business workspace plan mix</p></div><button class="link-btn" data-action="admin-tab" data-tab="businesses">Manage businesses →</button></div><div class="ff-admin-pad">${byPlan.map(p=>`<div class="progress-row"><div class="progress-label"><span>${p.name}</span><span>${p.count} workspace${p.count===1?'':'s'}</span></div><div class="ff-admin-meter"><span style="width:${ffOrgs.length?Math.max(p.count?6:0,p.count/ffOrgs.length*100):0}%"></span></div></div>`).join('')}<div class="subtle-note" style="margin-top:20px">Plan labels are demo metadata only; no payments, billing, or subscription entitlements are connected.</div><div class="report-box" style="margin-top:14px"><label>Approximate browser data footprint</label><strong>${(ffLocalStorageBytes()/1024).toFixed(1)} KB</strong><small>Current localStorage on this browser profile</small></div></div></section></div><section class="ff-admin-section" style="margin-top:17px"><div class="section-head"><div><h3>Quick actions</h3><p>Manage access and review the local prototype data</p></div></div><div class="ff-admin-pad ff-admin-actions"><button class="btn btn-primary" data-action="admin-create-user">${ico('plus',14)} Create user account</button><button class="btn btn-secondary" data-action="admin-tab" data-tab="users">Review all users</button><button class="btn btn-secondary" data-action="admin-tab" data-tab="businesses">Monitor businesses</button><button class="btn btn-secondary" data-action="admin-tab" data-tab="activity">Open audit log</button><button class="btn btn-secondary" data-action="admin-export-users">Export account list</button></div></section>`;
}
function ffAdminUsers(){
 const q=ffAdminSearch.toLowerCase().trim(),list=ffUsers.filter(u=>!q||[u.name,u.email,u.role,u.businessName,u.status].join(' ').toLowerCase().includes(q));
 return `<section class="ff-admin-section"><div class="section-head"><div><h3>All user accounts</h3><p>${list.length} of ${ffUsers.length} accounts · status and role management</p></div><div class="ff-admin-actions"><input class="ff-admin-filter" id="ffAdminSearch" placeholder="Search name, email or role…" value="${ffEsc(ffAdminSearch)}"><button class="btn btn-primary btn-sm" data-action="admin-create-user">${ico('plus',13)} Create account</button></div></div><div class="table-wrap"><table class="ff-admin-table"><thead><tr><th>User</th><th>Role</th><th>Business / workspace</th><th>Status</th><th>Last sign in</th><th>Actions</th></tr></thead><tbody>${list.map(u=>{const org=ffOrgs.find(o=>o.id===u.orgId);return `<tr><td><div class="ff-account-mini"><span class="mini-avatar">${ffEsc(initials(u.name))}</span><div class="info"><strong>${ffEsc(u.name)}</strong><small>${ffEsc(u.email)}</small></div></div></td><td><span class="ff-role-pill ${u.role}">${ffEsc(ffRoleLabel(u.role))}</span></td><td>${ffEsc(org?.name||u.businessName||'Platform-wide')}</td><td><span class="ff-admin-status ${(u.status||'Active').toLowerCase()}">${ffEsc(u.status||'Active')}</span></td><td>${u.lastLogin?ffEsc(new Date(u.lastLogin).toLocaleString('en-IN')):'<span style="color:#89948c">Never</span>'}</td><td><div class="ff-admin-action-row">${u.id===ffCurrentUser?.id?'<span class="ff-admin-subtle">Current session</span>':`<button class="ff-btn-link ${u.status==='Suspended'?'':'danger'}" data-action="admin-toggle-user-status" data-id="${ffEsc(u.id)}">${u.status==='Suspended'?'Reactivate':'Suspend'}</button>`}${u.role==='owner'&&org?`<button class="ff-btn-link" data-action="admin-open-business" data-org="${ffEsc(org.id)}">Business details</button>`:''}</div></td></tr>`}).join('')||'<tr><td colspan="6" class="ff-admin-empty">No accounts match this search.</td></tr>'}</tbody></table></div><div class="ff-admin-pad ff-admin-subtle">Demo credentials are seeded for testing and are not intended for deployment. Suspending an account is a prototype UI state, not server-enforced access control.</div></section>`;
}
function ffAdminBusinesses(){
 return `<section class="ff-admin-section"><div class="section-head"><div><h3>Business workspaces</h3><p>Owner account, plan, workspace status and local record counts</p></div><div class="ff-admin-actions"><button class="btn btn-primary btn-sm" data-action="admin-create-user">${ico('plus',13)} Create account</button><button class="btn btn-secondary btn-sm" data-action="admin-export-users">Export accounts</button></div></div><div class="table-wrap"><table class="ff-admin-table"><thead><tr><th>Business</th><th>Owner</th><th>Subscription</th><th>Status</th><th>Events</th><th>Clients</th><th>Staff</th><th>Actions</th></tr></thead><tbody>${ffOrgs.map(o=>{const owner=ffUsers.find(u=>u.email===o.ownerEmail)||ffUsers.find(u=>u.orgId===o.id&&u.role==='owner'),st=ffAdminWorkspaceStats(o.id);return `<tr><td><strong>${ffEsc(o.name)}</strong><small>${ffEsc(o.id)}</small></td><td>${ffEsc(owner?.name||'No owner')}<small>${ffEsc(o.ownerEmail||owner?.email||'')}</small></td><td><select class="filter-select" data-action="admin-plan-change" data-org="${ffEsc(o.id)}">${['Free','Starter','Professional','Enterprise'].map(p=>`<option ${o.plan===p?'selected':''}>${p}</option>`).join('')}</select></td><td><span class="ff-admin-status ${(o.status||'Active').toLowerCase()}">${ffEsc(o.status||'Active')}</span></td><td>${st.events}</td><td>${st.clients}</td><td>${st.staff}</td><td><button class="ff-btn-link ${o.status==='Suspended'?'':'danger'}" data-action="admin-toggle-org-status" data-org="${ffEsc(o.id)}">${o.status==='Suspended'?'Reactivate':'Suspend'}</button></td></tr>`}).join('')||'<tr><td colspan="8" class="ff-admin-empty">No business workspaces registered.</td></tr>'}</tbody></table></div><div class="ff-admin-pad ff-admin-subtle">Workspace counts are read from this browser's local storage. A production Superadmin console requires server-side aggregation and explicit access controls.</div></section>`;
}
function ffAdminActivity(){const list=ffAudit.filter(x=>!ffAdminSearch||[x.action,x.detail,x.userEmail,x.kind].join(' ').toLowerCase().includes(ffAdminSearch.toLowerCase()));return `<section class="ff-admin-section"><div class="section-head"><div><h3>Audit and activity log</h3><p>${list.length} matching local activity records</p></div><div class="ff-admin-actions"><input class="ff-admin-filter" id="ffAdminSearch" placeholder="Search activity…" value="${ffEsc(ffAdminSearch)}"><button class="btn btn-secondary btn-sm" data-action="admin-export-audit">Export log</button></div></div><div class="table-wrap"><table class="ff-admin-table"><thead><tr><th>Time</th><th>Action</th><th>Details</th><th>Account</th><th>Type</th></tr></thead><tbody>${list.map(x=>`<tr><td>${ffEsc(new Date(x.at).toLocaleString('en-IN'))}</td><td><strong>${ffEsc(x.action)}</strong></td><td>${ffEsc(x.detail||'')}</td><td>${ffEsc(x.userEmail||'system')}</td><td><span class="ff-role-pill">${ffEsc(x.kind||'info')}</span></td></tr>`).join('')||'<tr><td colspan="5" class="ff-admin-empty">No activity records found.</td></tr>'}</tbody></table></div><div class="ff-admin-pad ff-admin-subtle">This is a client-side demonstration log. Browser storage can be edited or cleared and is not an immutable security audit trail.</div></section>`}
function renderSuperadmin(){
 const tabs=[['overview','Overview'],['users','User accounts'],['businesses','Businesses & plans'],['activity','Activity log']];
 const content=ffAdminTab==='users'?ffAdminUsers():ffAdminTab==='businesses'?ffAdminBusinesses():ffAdminTab==='activity'?ffAdminActivity():ffAdminOverview();
 return `${pageHead('Platform-wide account and workspace monitoring','Superadmin console','Manage user access, business workspaces, plan metadata and local demo activity.',`<div class="ff-admin-actions"><button class="btn btn-secondary" data-action="admin-export-users">${ico('download',14)} Export accounts</button><button class="btn btn-primary" data-action="admin-create-user">${ico('plus',14)} Create account</button></div>`)}<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div class="ff-admin-kicker">FeastFlow platform operations</div><span class="ff-admin-status">Signed in as Superadmin</span></div><div class="ff-admin-tab-row">${tabs.map(([id,label])=>`<button class="ff-admin-tab ${ffAdminTab===id?'active':''}" data-action="admin-tab" data-tab="${id}">${label}</button>`).join('')}</div>${content}<div class="subtle-note" style="margin-top:14px">Prototype boundary: accounts, status changes and activity logs are stored in this browser only. This page does not monitor other devices or enforce authentication on a server.</div>`;
}
// Extend the original route table without disturbing the existing catering screens.
pageMeta.superadmin=['Platform administration','Superadmin console'];
const ffOriginalRenderPage=renderPage;
renderPage=function(){if(currentPage==='superadmin'){$('#pageContent').className='page-content';$('#pageContent').innerHTML=renderSuperadmin();$('#topbar').style.display='flex';$('#pageCrumb').textContent=pageMeta.superadmin[0];$('#pageTitle').textContent=pageMeta.superadmin[1];ffUpdateChrome();return;}ffOriginalRenderPage();};
const ffOriginalSetPage=setPage;
setPage=function(page){
  const role=ffCurrentUser?.role;
  if(page!=='storefront'&&!ffCurrentUser){ffAuthView('login');return;}
  if(role==='superadmin'&&page!=='superadmin'&&page!=='storefront')page='superadmin';
  if(role==='customer'&&page!=='storefront')page='storefront';
  if(role==='employee'&&!['dashboard','events','employee','storefront'].includes(page))page='employee';
  if(role==='manager'&&page==='settings')page='dashboard';
  ffOriginalSetPage(page);
  if($('#superadminNav'))$('#superadminNav').classList.toggle('active',page==='superadmin');
  ffApplyRoleUi();
};
const ffOriginalHandleAction=handleAction;
handleAction=function(action,el){
  if(action==='logout'){ffSignOut();return}
  if(action==='account-access'){ffAuthView('signup');return}
  if(action==='admin-tab'){ffAdminTab=el.dataset.tab||'overview';ffAdminSearch='';renderPage();return}
  if(action==='admin-create-user'){ffCreateAdminUserForm();return}
  if(action==='admin-toggle-user-status'){
    const u=ffUsers.find(x=>x.id===el.dataset.id);if(!u||u.id===ffCurrentUser?.id)return;
    u.status=u.status==='Suspended'?'Active':'Suspended';ffSaveUsers();ffLog(u.status==='Suspended'?'Account suspended':'Account reactivated',`${u.name} (${u.email})`,ffCurrentUser?.email||'superadmin','warning');renderPage();toast(`${u.name}: ${u.status}`);return;
  }
  if(action==='admin-toggle-org-status'){
    const o=ffOrgs.find(x=>x.id===el.dataset.org);if(!o)return;o.status=o.status==='Suspended'?'Active':'Suspended';ffSaveOrgs();ffLog(o.status==='Suspended'?'Business suspended':'Business reactivated',o.name,ffCurrentUser?.email||'superadmin','warning');renderPage();toast(`${o.name}: ${o.status}`);return;
  }
  if(action==='admin-open-business'){const o=ffOrgs.find(x=>x.id===el.dataset.org);if(o){modalOpen('Business workspace details',o.name,`<div class="grid three-col"><div class="report-box"><label>Plan</label><strong>${ffEsc(o.plan)}</strong></div><div class="report-box"><label>Status</label><strong>${ffEsc(o.status)}</strong></div><div class="report-box"><label>Created</label><strong>${ffEsc(new Date(o.createdAt).toLocaleDateString('en-IN'))}</strong></div></div><div class="subtle-note" style="margin-top:15px">The Superadmin console can see aggregate metadata in this prototype. Open business records remain local to each workspace.</div>`,null,{viewOnly:true})}return;}
  if(action==='admin-export-users'){
    const rows=[['Name','Email','Role','Business','Plan','Status','Created','Last login'],...ffUsers.map(u=>[u.name,u.email,u.role,u.businessName||ffOrgs.find(o=>o.id===u.orgId)?.name||'',u.plan||'',u.status||'',u.createdAt||'',u.lastLogin||''])];exportCsv('feastflow-demo-accounts.csv',rows);return;
  }
  if(action==='admin-export-audit'){exportCsv('feastflow-demo-activity.csv',[['Time','Action','Details','Account','Type'],...ffAudit.map(x=>[x.at,x.action,x.detail,x.userEmail,x.kind])]);return;}
  return ffOriginalHandleAction(action,el);
};
// Login, registration, and recovery form handlers.
document.addEventListener('submit',e=>{
  const f=e.target;if(f.id==='ffLoginForm'){
    e.preventDefault();const fd=new FormData(f),email=String(fd.get('email')||'').trim().toLowerCase(),password=String(fd.get('password')||''),u=ffFindUser(email);
    if(!u||u.password!==password){ffAuthView('login',{type:'error',text:'Email or password is incorrect. Use a seeded demo account or create an account.'});return;}
    if(u.status==='Suspended'){ffAuthView('login',{type:'error',text:'This account is suspended. Please contact the Superadmin.'});return;}
    ffStartSession(u);return;
  }
  if(f.id==='ffSignupForm'){e.preventDefault();ffCreateSignupAccount(f);return;}
  if(f.id==='ffRecoverForm'){
    e.preventDefault();const fd=new FormData(f),email=String(fd.get('email')||'').trim().toLowerCase(),password=String(fd.get('password')||''),confirmPassword=String(fd.get('confirmPassword')||''),u=ffFindUser(email);
    if(!u){ffAuthView('recover',{type:'error',text:'No local account exists for that email.'});return;}if(password.length<6||password!==confirmPassword){ffAuthView('recover',{type:'error',text:'Use at least 6 characters and make both password fields match.'});return;}u.password=password;ffSaveUsers();ffLog('Local demo password reset','Password changed without email verification',u.email,'warning');ffAuthView('login',{type:'success',text:'Demo password updated in this browser. Sign in with the new password.'});return;
  }
},true);
document.addEventListener('change',e=>{if(e.target?.id==='ffSignupRole'){const role=e.target.value,owner=role==='owner';const biz=$('#ffSignupBusinessWrap'),org=$('#ffSignupOrgWrap'),workspace=$('#ffSignupWorkspaceWrap'),businessInput=$('#ffSignupBusiness'),orgInput=$('#ffSignupOrg');if(biz)biz.style.display=owner?'block':'none';if(org)org.style.display=owner?'none':'block';if(workspace)workspace.style.display=owner?'block':'none';if(businessInput)businessInput.required=owner;if(orgInput)orgInput.required=!owner;}});
document.addEventListener('click',e=>{
  const gate=$('#authGate');const mode=e.target.closest('[data-auth-mode]');if(mode){ffAuthView(mode.dataset.authMode);return;}
  const fill=e.target.closest('[data-auth-fill]');if(fill){const u=ffFindUser(fill.dataset.authFill);if(u){ffAuthView('login');$('#ffLoginEmail').value=u.email;$('#ffLoginPassword').value=u.password;$('#ffLoginPassword').focus()}return;}
});
document.addEventListener('input',e=>{if(e.target?.id==='ffAdminSearch'){const pos=e.target.selectionStart;ffAdminSearch=e.target.value;renderPage();const n=$('#ffAdminSearch');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}});
document.addEventListener('change',e=>{const t=e.target;if(t?.matches('[data-action="admin-plan-change"]')){const o=ffOrgs.find(x=>x.id===t.dataset.org);if(o){const old=o.plan;o.plan=t.value;ffSaveOrgs();ffUsers.filter(u=>u.orgId===o.id).forEach(u=>u.plan=t.value);ffSaveUsers();ffLog('Subscription plan changed',`${o.name}: ${old} → ${t.value}`,ffCurrentUser?.email||'superadmin','warning');renderPage();toast(`${o.name} plan updated`);}}});
function ffInitAuth(){
  ffSeedPlatform();
  // Demo workspace migration: keep the older single-workspace data as the default owner's workspace.
  if(!localStorage.getItem('feastflow_workspace_org-demo'))ffWriteJson('feastflow_workspace_org-demo',state);
  const session=ffReadJson(FF_SESSION_KEY,null),existing=session&&ffUsers.find(u=>u.id===session.userId&&u.status!=='Suspended');
  if(location.hash.toLowerCase().startsWith('#storefront')){
    ffCurrentUser=null;ffActiveOrgId='';$('#authGate').style.display='none';document.body.style.overflow='';ffOriginalSetPage('storefront');return;
  }
  if(existing){ffCurrentUser=existing;ffActiveOrgId=existing.orgId||'';if(existing.orgId)ffLoadWorkspace(existing.orgId);ffApplyRoleUi();setPage(existing.role==='superadmin'?'superadmin':existing.role==='customer'?'storefront':existing.role==='employee'?'employee':'dashboard');}
  else{localStorage.removeItem(FF_SESSION_KEY);ffCurrentUser=null;ffActiveOrgId='';setPage('dashboard');ffAuthView('login');}
}
ffInitAuth();

// Keep public storefront links viewable without a business login. The auth initializer above handles the initial route.

})();
</script>
